  function openWizard(w) {
    w = Object.assign({ step: 0, fields: new Set(), jobs: new Set(), likes: new Set(), level: 0, time: 2, avoid: new Set(), off: new Set(), first: false, plz: '', umkreis: '25' }, w);
    const STEPS = w.first ? 8 : 7;                    // beim Erststart kommt die Frage nach dem Ort dazu
    const go = step => openWizard({ ...w, step });
    const nodes = [];
    const dots = el('div', 'dots');
    for (let i = 0; i < STEPS; i++) dots.append(el('i', i <= w.step ? 'on' : ''));
    nodes.push(dots);
    const ask = (q, hint) => { nodes.push(el('p', 'ask', q)); if (hint) nodes.push(el('p', 'small', hint)); };
    const opts = el('div', 'opts');
    const opt = (title, sub, pressed, onTap, iconPaths, color) => {
      const b = el('button', 'opt'); b.type = 'button'; b.setAttribute('aria-pressed', String(!!pressed));
      if (color) b.style.setProperty('--c', color);
      if (iconPaths) b.append(icon(iconPaths));
      const t = el('span'); t.append(el('b', null, title)); if (sub) t.append(el('small', null, sub));
      b.append(t); b.addEventListener('click', onTap); opts.append(b); return b;
    };
    const toggle = (set, key) => () => { set.has(key) ? set.delete(key) : set.add(key); openWizard(w); };
    const nav = (nextLabel, canNext) => {
      const bar = el('div', 'submitbar');
      const next = button(nextLabel, () => go(w.step + 1), true); next.disabled = !canNext;
      bar.append(next);
      if (w.step > 0) { const back = button('Zurück', () => go(w.step - 1)); back.className = 'textbtn'; bar.append(back); }
      return bar;
    };
    const chosen = FIELDS.filter(f => w.fields.has(f.id));          // gewählte Bereiche, in fester Reihenfolge
    const chosenJobs = chosen.flatMap(f => f.jobs);

    // Vorschlag aus den Antworten zusammensetzen
    const proposal = () => {
      const terms = [];
      const add = list => { for (const t of list) if (!terms.includes(t)) terms.push(t); };
      for (const [name, list] of chosenJobs) if (w.jobs.has(name)) add(list);
      LIKES.forEach(([name, list], i) => { if (w.likes.has(i)) add(list); });
      add(LEVELS[w.level][2]);
      const exclude = [];
      AVOID.forEach(([name, list], i) => { if (w.avoid.has(i)) for (const x of list) if (!exclude.includes(x)) exclude.push(x); });
      const picked = chosenJobs.map(j => j[0]).filter(n => w.jobs.has(n));
      let name = picked.length === 1 ? picked[0] : picked.length === 2 && (picked[0] + ' & ' + picked[1]).length <= 38 ? picked[0] + ' & ' + picked[1] : chosen.length === 1 ? chosen[0].name : 'Meine Auswahl';
      for (let n = 2; PROFILES.some(x => x.name === name); n++) name = name.replace(/ \d+$/, '') + ' ' + n;
      return { name, terms: terms.slice(0, 40), exclude };
    };

    if (w.step === 0) {
      if (w.first) nodes.push(el('p', 'small', 'Willkommen bei Jobstapel. Ein paar kurze Fragen, dann siehst du passende Stellen aus deiner Gegend.'));
      ask('In welchen Bereichen möchtest oder kannst du künftig arbeiten?', 'Mehrere sind möglich. Das kann dein bisheriger Beruf sein, muss es aber nicht.');
      for (const f of FIELDS) opt(f.name, '', w.fields.has(f.id), toggle(w.fields, f.id), ICONSET[f.icon], f.color);
      nodes.push(opts, nav('Weiter', w.fields.size > 0));
      const manual = w.first ? button('Überspringen und mit Beispielberufen starten', closeSheet) : button('Ohne Fragen selbst anlegen', () => openProfileEdit(null));
      manual.className = 'textbtn';
      nodes.push(manual);
    } else if (w.step === 1) {
      // Tätigkeiten aus abgewählten Bereichen nicht mitschleppen
      for (const n of [...w.jobs]) if (!chosenJobs.some(j => j[0] === n)) w.jobs.delete(n);
      ask('Welche Tätigkeiten kommen für dich in Frage?', 'Mehrere sind möglich. Je mehr du wählst, desto mehr Stellen siehst du.');
      nodes.push(opts);
      for (const f of chosen) {
        const head = el('span', 'group-label', f.name); head.style.marginTop = '8px';
        opts.append(head);
        const all = f.jobs.every(j => w.jobs.has(j[0]));
        opt('Alles aus diesem Bereich', '', all, () => { f.jobs.forEach(j => all ? w.jobs.delete(j[0]) : w.jobs.add(j[0])); openWizard(w); }, null, f.color);
        for (const [name, list] of f.jobs) opt(name, list.join(', '), w.jobs.has(name), toggle(w.jobs, name), null, f.color);
      }
      nodes.push(nav('Weiter', w.jobs.size > 0));
    } else if (w.step === 2) {
      ask('Was würdest du außerdem gern machen?', 'Das erweitert die Suche um Stellen aus anderen Bereichen. Du kannst die Frage auch überspringen.');
      LIKES.forEach(([name, list], i) => opt(name, list.join(', '), w.likes.has(i), toggle(w.likes, i)));
      nodes.push(opts, nav(w.likes.size ? 'Weiter' : 'Überspringen', true));
    } else if (w.step === 3) {
      ask('Auf welcher Stufe suchst du?');
      LEVELS.forEach(([name, sub], i) => opt(name, sub, w.level === i, () => openWizard({ ...w, level: i, step: 4 })));
      nodes.push(opts, nav('Weiter', true));
    } else if (w.step === 4) {
      ask('Wie viel möchtest du arbeiten?');
      TIMES.forEach(([name], i) => opt(name, '', w.time === i, () => openWizard({ ...w, time: i, step: 5 })));
      nodes.push(opts, nav('Weiter', true));
    } else if (w.step === 5) {
      ask('Was soll nicht dabei sein?', 'Stellen mit diesen Wörtern im Titel werden ausgeblendet. Du kannst die Frage auch überspringen.');
      AVOID.forEach(([name, list], i) => opt(name, list.join(', '), w.avoid.has(i), toggle(w.avoid, i)));
      nodes.push(opts, nav(w.avoid.size ? 'Weiter' : 'Überspringen', true));
    } else if (w.first && w.step === 6) {
      ask('Wo suchst du?', 'Trag deine Postleitzahl ein. Bei kleinen Orten klappt die Postleitzahl besser als der Ortsname.');
      const plz = el('input'); plz.type = 'text'; plz.id = 'wiz-plz'; plz.inputMode = 'numeric'; plz.maxLength = 40; plz.autocomplete = 'postal-code'; plz.value = w.plz; plz.placeholder = 'z. B. 02997';
      const l = el('label', null, 'Postleitzahl'); l.htmlFor = plz.id; l.append(plz);
      nodes.push(l, el('span', 'group-label', 'Umkreis'));
      for (const [v, t] of [['10', '10 km'], ['25', '25 km'], ['50', '50 km'], ['100', '100 km']]) opt(t, '', w.umkreis === v, () => openWizard({ ...w, umkreis: v }));
      const bar = nav('Weiter', w.plz.trim().length >= 3);
      plz.addEventListener('input', () => { w.plz = plz.value; bar.querySelector('.btn.fill').disabled = plz.value.trim().length < 3; });
      nodes.push(opts, bar);
    } else {
      const pr = proposal();
      const active = pr.terms.filter(t => !w.off.has(t));
      ask(`Deine Suche „${pr.name}“`, `${active.length} Suchbegriffe. Tippe einen an, um ihn wegzulassen.`);
      const chips = el('div', 'chips');
      for (const t of pr.terms) {
        const b = el('button', 'fchip term', t); b.type = 'button'; b.setAttribute('aria-pressed', String(!w.off.has(t)));
        b.addEventListener('click', toggle(w.off, t)); chips.append(b);
      }
      nodes.push(chips);
      const facts = [TIMES[w.time][0] === 'Egal' ? 'Arbeitszeit egal' : TIMES[w.time][0]];
      if (w.first) facts.unshift(`${w.plz.trim()} · ${w.umkreis} km`);
      if (pr.exclude.length) facts.push('ohne: ' + pr.exclude.join(', '));
      nodes.push(el('p', 'small', facts.join(' · ')));
      const bar = el('div', 'submitbar');
      const create = button('Beruf anlegen und Stellen zeigen', () => {
        const next = cleanProfile({ name: pr.name, color: chosen[0].color, icon: chosen[0].icon, terms: active, exclude: pr.exclude, minijob: TIMES[w.time][2], arbeitszeit: TIMES[w.time][1] });
        PROFILES.push(next); profile = next; store.profil = next.id;
        if (w.first) { store.ort = w.plz.trim(); store.umkreis = w.umkreis; }
        save(); closeSheet(); renderChrome(); resetDeck();
      }, true);
      create.disabled = active.length === 0;
      const back = button('Zurück', () => go(STEPS - 2)); back.className = 'textbtn';
      bar.append(create, back);
      nodes.push(bar, el('p', 'small', 'Name, Farbe und Begriffe kannst du später unter „Berufe bearbeiten“ ändern.'));
    }
    const keep = $('sheet-body').scrollTop, same = !$('sheet').hidden && $('sheet-title').dataset.step === String(w.step);
    openSheet((w.first ? 'Los geht’s' : 'Neuer Beruf') + ' · ' + (w.step < STEPS - 1 ? `Frage ${w.step + 1} von ${STEPS - 1}` : 'Vorschlag'), ...nodes);
    $('sheet-title').dataset.step = String(w.step);
    if (same) $('sheet-body').scrollTop = keep;        // beim An- und Abwählen nicht nach oben springen
  }

  function openProfileEdit(p) {
    const isNew = !p;
    const d = p || { name: '', color: COLORS[PROFILES.length % COLORS.length], icon: 'star', terms: [], exclude: [], include: [], minijob: false, arbeitszeit: [] };
    const form = el('form');
    let n = 0;
    const field = (text, node, id) => { const l = el('label', null, text); node.id = id; l.htmlFor = id; l.append(node); return l; };
    const name = el('input'); name.type = 'text'; name.value = d.name; name.maxLength = 40; name.required = true; name.placeholder = 'z. B. Buchhaltung'; name.autocomplete = 'off';
    const terms = el('textarea'); terms.rows = 5; terms.value = d.terms.join('\n'); terms.placeholder = 'Ein Suchbegriff pro Zeile, z. B.\nBuchhalter\nFinanzbuchhalter\nLohnbuchhalter';

      const inputs = items.map(([value, node, color]) => {
        const l = el('label', 'pick ' + cls); const c = el('input');
        c.type = 'radio'; c.name = cls; c.value = value; c.checked = value === current; c.id = 'pe-' + (++n); l.htmlFor = c.id;
        if (color) l.style.setProperty('--c', color);
        l.append(c, node); fs.append(l); return c;
      });
      return [fs, inputs];
    };
    const [colorSet, colorBoxes] = swatches('Farbe', COLORS.map(c => { const dot = el('span', 'dot'); dot.style.background = c; const t = el('span', 'sr', 'Farbe ' + c); dot.append(t); return [c, dot, c]; }), d.color, 'sw');
    const [iconSet, iconBoxes] = swatches('Symbol', Object.keys(ICONSET).map(k => { const g = icon(ICONSET[k]); const w = el('span'); w.append(g, el('span', 'sr', k)); return [k, w]; }), d.icon, 'ic');
    const mjL = el('label', 'pick'); const mj = el('input'); mj.type = 'checkbox'; mj.checked = d.minijob; mj.id = 'pe-' + (++n); mjL.htmlFor = mj.id; mjL.append(mj, document.createTextNode('Nur Minijobs'));
    const mjSet = el('fieldset'); mjSet.append(mjL);
    const ok = button(isNew ? 'Beruf anlegen' : 'Speichern', () => {}, true); ok.type = 'submit';
    const row = el('div', 'links'); row.append(ok, button('Abbrechen', openProfiles));
    form.append(field('Name', name, 'pe-name'), field('Suchbegriffe', terms, 'pe-terms'),
      el('p', 'small', 'Jeder Begriff wird einzeln gesucht, die Treffer werden zusammengeführt. Ohne Begriffe erscheinen alle Stellen im Umkreis.'),
      field('Nur zeigen, wenn Titel oder Beruf eines dieser Wörter enthält', incl, 'pe-incl'),
      field('Ausblenden, wenn Titel, Beruf oder Arbeitgeber eines dieser Wörter enthält', excl, 'pe-excl'), colorSet, iconSet, mjSet, row);
    form.addEventListener('submit', e => {
      e.preventDefault();
      const lines = t => t.value.split(/[\n,;]+/);
      const next = cleanProfile({ id: p ? p.id : '', name: name.value.trim(), color: (colorBoxes.find(c => c.checked) || {}).value, icon: (iconBoxes.find(c => c.checked) || {}).value, terms: lines(terms), exclude: lines(excl), include: lines(incl), minijob: mj.checked, arbeitszeit: d.arbeitszeit });
      if (p) Object.assign(p, next); else PROFILES.push(next);
      profile = p || next; store.profil = profile.id;
      save(); closeSheet(); renderChrome(); resetDeck();
    });
    const nodes = [form];
    if (p && PROFILES.length > 1) {
      const del = button('Diesen Beruf löschen', () => {
        if (del.dataset.sure !== '1') { del.dataset.sure = '1'; del.textContent = 'Wirklich löschen? Noch einmal tippen'; return; }
        PROFILES.splice(PROFILES.indexOf(p), 1);
        if (profile === p) { profile = PROFILES[0]; store.profil = profile.id; renderChrome(); resetDeck(); }
        save(); openProfiles();
      });
      del.classList.add('quiet', 'danger');
      nodes.push(del);
    }
    const std = DEFAULT_PROFILES.find(x => p && x.id === p.id);
    if (std) {
      const res = button('Auf Vorgabe zurücksetzen', () => { Object.assign(p, cleanProfile(std)); save(); if (profile === p) { renderChrome(); resetDeck(); } openProfileEdit(p); });
      res.classList.add('quiet');
      nodes.push(res);
    }
    openSheet(isNew ? 'Neuer Beruf' : p.name, ...nodes);
  }

    if (p.os === 'desktop') {                        // Computer: nur ein Hinweis, einmal
      if (!force && flag('jobstapel.installSeen')) return;
      flag('jobstapel.installSeen', '1');
      const note = el('p', 'small', 'So hast du Jobstapel immer griffbereit. Am bequemsten wischt es sich am Handy.');
      return openSheet('Als App speichern', note, ...installGuide(p));
    }
    if (!force && flag(GATE_KEY)) { $('nag').hidden = false; return; }
    const gate = el('div', 'gate');
    gate.id = 'gate'; gate.setAttribute('role', 'dialog'); gate.setAttribute('aria-modal', 'true'); gate.setAttribute('aria-labelledby', 'gate-h');
    const inner = el('div', 'gate-in');
    const brand = $('view-deck').parentNode.querySelector('.brand').cloneNode(true);
    const h = el('h2', null, appInstalled ? 'Die App ist installiert' : 'Zuerst die App installieren');
    h.id = 'gate-h';
    inner.append(brand, h);
    if (appInstalled) {
      inner.append(el('p', 'notice', 'Öffne sie jetzt über das Symbol „Jobstapel“ auf deinem Startbildschirm. Dieses Browserfenster kannst du schließen.'));
    } else {
      const box = el('div', 'box');
      box.append(el('h3', null, 'So geht’s'), ...installGuide(p));
      if (p.browser === 'inapp' || p.browser === 'other') {
        box.append(button('Adresse kopieren', async e => {
          try { await navigator.clipboard.writeText('https://jobs.micana.de'); e.target.textContent = 'Kopiert – im Browser einfügen'; }
          catch (err) { e.target.textContent = 'jobs.micana.de'; }
        }));
      }
      const why = el('ul', 'why');
      for (const [strong, rest] of [['Immer auf dem Startbildschirm', ' – wie eine richtige App.'], ['Startet sofort', ' – ohne Adresszeile und im Vollbild.'], ['Deine Merkliste ist sicherer', ' – der Browser löscht sie nicht so leicht.']]) {
        const li = el('li'); li.append(el('b', null, strong), document.createTextNode(rest)); why.append(li);
      }
      inner.append(box, why);
      if (p.os === 'ios' && p.browser !== 'inapp') {
        const n = el('p', 'notice');
        n.append('Wichtig auf iPhone und iPad: Was du hier im Browser merkst, wird ', el('b', null, 'nicht'), ' automatisch in die installierte App übernommen. Installiere deshalb zuerst. Bereits Gemerktes kannst du unter „Gemerkt“ → „Sichern“ per Code mitnehmen.');
        inner.append(n);
      }
    }
    const skip = el('button', 'skip', appInstalled ? 'Trotzdem im Browser weiter' : 'Ohne Installation im Browser weiter');
    skip.type = 'button';
    skip.addEventListener('click', () => { flag(GATE_KEY, String(Date.now())); gate.remove(); $('nag').hidden = false; });
    inner.append(skip);
    gate.append(inner);
    document.body.append(gate);
    // Chrome/Android kann prüfen, ob die App schon installiert ist
    if (!appInstalled && navigator.getInstalledRelatedApps) {
      navigator.getInstalledRelatedApps().then(apps => { if (apps && apps.length) { appInstalled = true; if (document.getElementById('gate')) installHint(true); } }).catch(() => {});
    }
  }
  $('nag').addEventListener('click', () => installHint(true));

  // ---------- Updates: neue Version wartet, bis „Jetzt aktualisieren“ getippt wird ----------
  function showUpdate(worker) {
    if (document.getElementById('update')) return;
    const bar = el('div', 'update');
    bar.id = 'update'; bar.setAttribute('role', 'status');
    const go = button('Jetzt aktualisieren', () => { go.textContent = 'Lädt …'; go.disabled = true; worker.postMessage({ type: 'SKIP_WAITING' }); }, true);
    bar.append(el('span', null, 'Neue Version verfügbar'), go);
    document.body.append(bar);
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
    let controlled = !!navigator.serviceWorker.controller, reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!controlled) { controlled = true; return; }          // erster Besuch: kein Neuladen nötig
      if (reloading) return;
      reloading = true; location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(reg => {
      const offer = w => { if (w && navigator.serviceWorker.controller) showUpdate(w); };
      if (reg.waiting) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); }); });
      // beim Zurückkehren in die App nach Updates schauen
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch(() => {});
  }

  // ---------- Verdrahtung ----------
  $('yes').addEventListener('click', () => decide('yes'));
  $('no').addEventListener('click', () => decide('no'));
  $('undo').addEventListener('click', undo);
  $('info').addEventListener('click', () => openDetails(deck[0]));
  $('open-filter').addEventListener('click', openFilter);
  $('open-backup').addEventListener('click', openBackup);
  $('tab-deck').addEventListener('click', () => show('deck'));
  $('tab-saved').addEventListener('click', () => show('saved'));
  $('sheet-close').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', e => {
    if (!$('sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
    if (view !== 'deck' || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') decide('yes');
    else if (e.key === 'ArrowLeft') decide('no');
    else if (e.key === 'ArrowUp') openDetails(deck[0]);
  });
  window.addEventListener('hashchange', () => { const v = location.hash === '#gemerkt' ? 'saved' : 'deck'; if (v !== view) show(v); });

  // Zoomen aus: iOS Safari ignoriert die Viewport-Angabe, daher zusätzlich die Zoom-Gesten abfangen.
  for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  if (location.hash === '#gemerkt') { view = 'saved'; renderSaved(); checkSaved(); }
  renderChrome();
  render();
  detectBase().then(resetDeck);
  installHint();
  // Erststart: zuerst der Assistent (am Handy liegt der Installationshinweis darüber, bis er geschlossen wird)
  if (firstStart) { flag('jobstapel.onboarded', '1'); openWizard({ first: true }); }
})();
</script>
</body>
</html>
