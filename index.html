<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<title>Jobstapel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: eine Bildschirmhöhe. Kopf, Profil-Leiste, Kartenstapel (füllt den Rest), Aktionsknöpfe. */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --ink: #171a22;
  --muted: #5e6675;
  --line: #d9dde6;
  --accent: #2563c9;            /* wird je Profil per Script gesetzt */
  --yes: #1f8a5b;
  --no: #c23b3b;
  --shadow: 0 10px 30px rgba(23, 26, 34, .12);
  --font-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1c212b; --ink: #eef0f5; --muted: #9aa3b3; --line: #2e3542;
    --yes: #4cc48f; --no: #f07a7a; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1c212b; --ink: #eef0f5; --muted: #9aa3b3; --line: #2e3542;
  --yes: #4cc48f; --no: #f07a7a; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body);
  overflow: hidden; overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.app {
  height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font: 800 1.55rem/1 var(--font-display); margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.tools { display: flex; gap: 8px; }
.tool {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-weight: 600; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px;
}
.tool b { background: var(--accent); color: #fff; border-radius: 999px; min-width: 1.5em; padding: 0 6px; text-align: center; font-size: .8rem; font-variant-numeric: tabular-nums; }

.profiles { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.profiles::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 14px; font-weight: 600; font-size: .92rem; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 8px;
}
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.chip[aria-pressed="true"] i { background: #fff; }

.where { font-size: .86rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.where button { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

.deck { position: relative; flex: 1; min-height: 0; }
.card {
  position: absolute; inset: 0; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow);
  border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden;
  transform-origin: 50% 100%; will-change: transform; user-select: none; -webkit-user-select: none;
}
.card.top { touch-action: none; cursor: grab; }
.card.fly { transition: transform .28s ease-in, opacity .28s ease-in; }
.card.back { transition: transform .2s ease-out; }
.card:nth-last-child(2) { transform: translateY(10px) scale(.96); }
.card:nth-last-child(3) { transform: translateY(20px) scale(.92); }
.band {
  background: color-mix(in srgb, var(--accent) 16%, var(--surface));
  padding: 16px 18px; display: flex; gap: 12px; align-items: center;
}
.badge {
  flex: none; width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font: 800 1.3rem var(--font-display); overflow: hidden;
}
.badge img { width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 4px; }
.band .who { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.band .ort { font-size: .88rem; color: var(--muted); }
.body { padding: 16px 18px 0; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.card h2 {
  font: 800 clamp(1.25rem, 5.4vw, 1.7rem)/1.12 var(--font-display); margin: 0; letter-spacing: -.01em;
  text-wrap: balance; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.excerpt { margin: 0; color: var(--muted); font-size: .95rem; flex: 1; min-height: 0; overflow: hidden;
  -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); white-space: pre-line; }
.foot { padding: 12px 18px 16px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .8rem; font-weight: 500; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); }
.tag.new { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }
.stamp {
  position: absolute; top: 22px; font: 800 1.5rem var(--font-display); text-transform: uppercase; letter-spacing: .04em;
  border: 3px solid; border-radius: 10px; padding: 2px 12px; opacity: 0; background: var(--surface); pointer-events: none;
}
.stamp.yes { left: 18px; color: var(--yes); transform: rotate(-12deg); }
.stamp.no { right: 18px; color: var(--no); transform: rotate(12deg); }

.state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; color: var(--muted); }
.state strong { font: 800 1.3rem var(--font-display); color: var(--ink); }
.state p { margin: 0; max-width: 34ch; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 18px; font-weight: 600; }
.btn.fill { background: var(--accent); border-color: var(--accent); color: #fff; }

.actions { display: flex; justify-content: center; align-items: center; gap: 18px; padding-top: 12px; }
.round {
  width: 62px; height: 62px; border-radius: 50%; border: 2px solid; background: var(--surface);
  display: grid; place-items: center; box-shadow: var(--shadow);
}
.round svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.round.no { color: var(--no); }
.round.yes { color: var(--yes); }
.round.small { width: 46px; height: 46px; color: var(--muted); border-color: var(--line); box-shadow: none; }
.round.small svg { width: 20px; height: 20px; }
.round:disabled { opacity: .35; cursor: default; }
.round:active:not(:disabled) { transform: scale(.94); }
.note { font-size: .78rem; color: var(--muted); text-align: center; margin: 0; }

.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: rgba(10, 12, 18, .5); }
.sheet[hidden] { display: none; }
.panel {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column; box-shadow: var(--shadow);
}
.panel.settle { transition: transform .22s ease-out; }
.grip { flex: none; align-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin-top: 10px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 18px 10px; }
.panel-head h2 { font: 800 1.3rem/1.15 var(--font-display); margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.close { flex: none; border: 1px solid var(--line); background: var(--bg); border-radius: 50%; width: 38px; height: 38px; font-size: 1.1rem; line-height: 1; }
.panel-body { overflow-y: auto; padding: 0 18px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.sub { color: var(--muted); margin: 0; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-width: 65ch; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
dl { display: grid; grid-template-columns: minmax(100px, max-content) 1fr; gap: 4px 14px; margin: 8px 0 0; font-size: .86rem; }
dt { color: var(--muted); overflow-wrap: anywhere; } dd { margin: 0; overflow-wrap: anywhere; }
summary { cursor: pointer; color: var(--muted); font-size: .88rem; font-weight: 500; }
.saved { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.saved li { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border-left: 5px solid var(--c, var(--accent)); }
.saved h3 { margin: 0; font: 600 1rem/1.3 var(--font-body); overflow-wrap: anywhere; }
.saved .row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .9rem; align-items: center; }
.saved .row button { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.saved .row .del { color: var(--no); }
label { display: flex; flex-direction: column; gap: 4px; font-size: .84rem; color: var(--muted); font-weight: 500; }
input[type="text"], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.terms { font-size: .86rem; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { .card.fly, .card.back, .panel.settle { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Job<span>stapel</span></h1>
    <div class="tools">
      <button type="button" class="tool" id="open-saved">Gemerkt <b id="saved-count">0</b></button>
      <button type="button" class="tool" id="open-settings" aria-label="Ort und Einstellungen">Ort</button>
    </div>
  </header>

  <nav class="profiles" id="profiles" aria-label="Berufsgruppen"></nav>

  <div class="where">
    <span id="where-text"></span>
    <span id="left" role="status"></span>
  </div>

  <main class="deck" id="deck" aria-live="polite"></main>

  <div class="actions">
    <button type="button" class="round small" id="undo" aria-label="Letzte Entscheidung zurücknehmen" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button type="button" class="round no" id="no" aria-label="Verwerfen">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button type="button" class="round yes" id="yes" aria-label="Merken">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
    </button>
    <button type="button" class="round small" id="info" aria-label="Details anzeigen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
    </button>
  </div>
  <p class="note" id="note">Nach rechts wischen merkt die Stelle, nach links verwirft sie. Antippen zeigt Details.</p>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grip" aria-hidden="true"></div>
    <div class="panel-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="close" id="sheet-close" aria-label="Schließen">✕</button>
    </div>
    <div class="panel-body" id="sheet-body"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // Berufsgruppen: Hinter jedem Profil stecken mehrere Suchbegriffe, die einzeln abgefragt und zusammengeführt werden.
  const PROFILES = [
    { id: 'sozial', name: 'Erzieher & HEP', color: '#d4482b',
      terms: ['Heilerziehungspfleger', 'Erzieher', 'Pädagogische Fachkraft', 'Heilpädagoge', 'Kindheitspädagoge', 'Betreuungsfachkraft Eingliederungshilfe'] },
    { id: 'social', name: 'Social Media', color: '#b22f82',
      terms: ['Social Media Manager', 'Online Marketing Manager', 'Content Manager', 'Community Manager', 'Content Creator', 'Marketing Manager Kommunikation', 'Referent Öffentlichkeitsarbeit'] },
    { id: 'buero', name: 'Sachbearbeitung', color: '#a26400',
      terms: ['Sachbearbeiter Vertriebsinnendienst', 'Vertriebsassistent', 'Kaufmännischer Mitarbeiter Vertrieb', 'Sachbearbeiter Auftragsabwicklung', 'Medienkaufmann', 'Verlag', 'Redakteur', 'Journalist', 'Lektor', 'Redaktionsassistent'] },
    { id: 'neben', name: 'Nebenjobs', color: '#1f8a5b',
      terms: [''], extra: { arbeitszeit: 'mj' }, hint: 'alle Minijobs im Umkreis' },
    { id: 'it', name: 'IT', color: '#2563c9',
      terms: ['Systemadministrator', 'IT-Administrator', 'IT-Leiter', 'System Engineer', 'Security Engineer', 'IT-Sicherheit', 'Microsoft 365', 'Cloud Engineer', 'Netzwerkadministrator', 'IT-Koordinator'] },
  ];
  const WORKER = 'https://jobs-ba-api.micana.workers.dev/';
  const SIZE = 25;
  const KEY = 'jobstapel-v1';

  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  // ---------- Speicher (nur in diesem Browser) ----------
  const store = { ort: 'Dresden', umkreis: '25', profil: 'sozial', liked: {}, seen: {} };
  try { Object.assign(store, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  if (!PROFILES.some(p => p.id === store.profil)) store.profil = PROFILES[0].id;
  function save() {
    const keys = Object.keys(store.seen);
    if (keys.length > 4000) for (const k of keys.slice(0, keys.length - 3000)) delete store.seen[k];
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  // ---------- API ----------
  let base = WORKER;
  async function detectBase() {
    // Läuft die Seite über "python3 jobsuche.py serve", wird dessen lokaler Proxy genutzt.
    if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
    try { const r = await fetch('api/ping', { cache: 'no-store' }); if (r.ok && (await r.json()).ok) base = ''; } catch (e) {}
  }
  async function api(path) {
    const r = await fetch(base + path);
    if (!r.ok) throw Object.assign(new Error('Fehler ' + r.status), { status: r.status });
    return r;
  }
  const details = new Map();
  function loadDetails(refnr) {
    if (!details.has(refnr)) {
      details.set(refnr, api('api/jobdetails/' + encodeURIComponent(refnr)).then(r => r.json()).catch(e => { details.delete(refnr); throw e; }));
    }
    return details.get(refnr);
  }
  const logos = new Map();
  function loadLogo(hash) {
    if (!logos.has(hash)) {
      logos.set(hash, api('api/logo/' + encodeURIComponent(hash)).then(r => r.blob()).then(b => URL.createObjectURL(b)).catch(() => null));
    }
    return logos.get(hash);
  }

  // ---------- Stapel ----------
  let profile = PROFILES.find(p => p.id === store.profil);
  let deck = [], inDeck = new Set(), pageNo = 0, exhausted = false, loading = false, failed = '', fallback = false, run = 0;
  const history = [];

  const fmtDate = s => { const d = new Date(s); return !s || isNaN(d) ? '' : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
  const isNew = s => { const d = new Date(s); return !isNaN(d) && Date.now() - d.getTime() < 3 * 864e5; };
  const time = j => { const d = new Date(j.aktuelleVeroeffentlichungsdatum); return isNaN(d) ? 0 : d.getTime(); };

  function slim(job, term) {
    const o = job.arbeitsort || {};
    return {
      refnr: job.refnr || job.referenznummer || '', titel: job.titel || job.beruf || '(ohne Titel)',
      arbeitgeber: job.arbeitgeber || '', plz: o.plz || '', ort: o.ort || '',
      entfernung: Number(o.entfernung) > 0 ? Math.round(Number(o.entfernung)) : 0,
      aktuelleVeroeffentlichungsdatum: job.aktuelleVeroeffentlichungsdatum || '', eintrittsdatum: job.eintrittsdatum || '',
      kundennummerHash: job.kundennummerHash || '', externeUrl: /^https?:\/\//i.test(job.externeUrl || '') ? job.externeUrl : '',
      term, profil: profile.id,
    };
  }

  async function loadMore() {
    if (loading || exhausted) return;
    loading = true; failed = '';
    const my = run;
    render();
    let tries = 0;
    while (my === run && !exhausted && deck.length < 6 && tries++ < 4) {
      pageNo++;
      const results = await Promise.allSettled(profile.terms.map(async term => {
        const p = new URLSearchParams({ angebotsart: '1', zeitarbeit: 'false', pav: 'false', page: String(pageNo), size: String(SIZE) });
        if (term) p.set('was', term);
        if (store.ort.trim()) { p.set('wo', store.ort.trim()); p.set('umkreis', store.umkreis); }
        for (const [k, v] of Object.entries(profile.extra || {})) p.set(k, v);
        const data = await (await api('api/jobs?' + p)).json();
        return { term, data };
      }));
      if (my !== run) return;
      const ok = results.filter(r => r.status === 'fulfilled').map(r => r.value);
      if (!ok.length) { failed = String(results[0].reason?.message || results[0].reason || 'unbekannt'); pageNo--; break; }
      let full = false;
      const batch = [];
      for (const { term, data } of ok) {
        const list = data.stellenangebote || [];
        if (data.quelle === 'html') fallback = true;
        if (list.length >= SIZE && (Number(data.maxErgebnisse) || 0) > pageNo * SIZE) full = true;
        for (const raw of list) {
          const job = slim(raw, term);
          if (!job.refnr || inDeck.has(job.refnr) || store.seen[job.refnr] || store.liked[job.refnr]) continue;
          inDeck.add(job.refnr);
          batch.push(job);
        }
      }
      batch.sort((a, b) => time(b) - time(a));
      deck.push(...batch);
      if (!full) exhausted = true;
    }
    if (my !== run) return;
    loading = false;
    render();
  }

  function resetDeck() {
    run++;
    deck = []; inDeck = new Set(); pageNo = 0; exhausted = false; loading = false; failed = ''; fallback = false; history.length = 0;
    loadMore();
  }

  // ---------- Darstellung ----------
  function renderChrome() {
    document.documentElement.style.setProperty('--accent', profile.color);
    $('profiles').replaceChildren(...PROFILES.map(p => {
      const b = el('button', 'chip');
      b.type = 'button';
      b.style.setProperty('--c', p.color);
      b.setAttribute('aria-pressed', String(p.id === profile.id));
      b.append(el('i'), document.createTextNode(p.name));
      b.addEventListener('click', () => { if (p.id === profile.id) return; profile = p; store.profil = p.id; save(); renderChrome(); resetDeck(); });
      return b;
    }));
    const ort = store.ort.trim();
    $('where-text').replaceChildren(document.createTextNode(ort ? `${ort}, ${store.umkreis === '0' ? 'nur dieser Ort' : store.umkreis + ' km Umkreis'} ` : 'Deutschlandweit '));
    const terms = el('button', null, 'Suchbegriffe');
    terms.type = 'button';
    terms.addEventListener('click', openSettings);
    $('where-text').append(terms);
    $('saved-count').textContent = String(Object.keys(store.liked).length);
  }

  function card(job, top) {
    const c = el('article', 'card' + (top ? ' top' : ''));
    c.dataset.ref = job.refnr;
    const band = el('div', 'band');
    const badge = el('span', 'badge', (job.arbeitgeber.trim()[0] || '?').toUpperCase());
    const who = el('div');
    who.append(el('div', 'who', job.arbeitgeber || 'Arbeitgeber nicht genannt'));
    const place = [job.plz, job.ort].filter(Boolean).join(' ');
    who.append(el('div', 'ort', (place || 'Ort nicht genannt') + (job.entfernung ? ` · ${job.entfernung} km` : '')));
    band.append(badge, who);
    const body = el('div', 'body');
    body.append(el('h2', null, job.titel));
    const ex = el('p', 'excerpt');
    body.append(ex);
    const foot = el('div', 'foot');
    if (isNew(job.aktuelleVeroeffentlichungsdatum)) foot.append(el('span', 'tag new', 'Neu'));
    if (job.aktuelleVeroeffentlichungsdatum) foot.append(el('span', 'tag', 'online seit ' + fmtDate(job.aktuelleVeroeffentlichungsdatum)));
    if (job.eintrittsdatum) foot.append(el('span', 'tag', 'Start ' + fmtDate(job.eintrittsdatum)));
    if (job.term) foot.append(el('span', 'tag', job.term));
    c.append(band, body, foot, el('span', 'stamp yes', 'Merken'), el('span', 'stamp no', 'Weg'));

    if (top) {
      loadDetails(job.refnr).then(d => {
        const text = String(d.stellenangebotsBeschreibung || d.stellenbeschreibung || '').replace(/\n{3,}/g, '\n\n').trim();
        ex.textContent = text.slice(0, 700);
        const hash = d.arbeitgeberKundennummerHash || job.kundennummerHash;
        if (hash) loadLogo(hash).then(src => { if (!src) return; const img = el('img'); img.alt = ''; img.src = src; badge.replaceChildren(img); });
      }).catch(() => { ex.textContent = ''; });
      drag(c);
    }
    return c;
  }

  function state(title, text, ...buttons) {
    const s = el('div', 'state');
    s.append(el('strong', null, title), el('p', null, text), ...buttons);
    return s;
  }
  function button(label, fn, fill) { const b = el('button', 'btn' + (fill ? ' fill' : ''), label); b.type = 'button'; b.addEventListener('click', fn); return b; }

  function render() {
    const d = $('deck');
    const has = deck.length > 0;
    $('yes').disabled = $('no').disabled = $('info').disabled = !has;
    $('undo').disabled = history.length === 0;
    $('left').textContent = has ? `${deck.length}${exhausted ? '' : '+'} im Stapel` : '';
    $('saved-count').textContent = String(Object.keys(store.liked).length);
    $('note').textContent = fallback
      ? 'Eingeschränkter Modus: Die Treffer stammen aus der Webseiten-Suche der Arbeitsagentur, Details können fehlen.'
      : 'Nach rechts wischen merkt die Stelle, nach links verwirft sie. Antippen zeigt Details.';
    const key = has ? deck.slice(0, 3).map(j => j.refnr).join('|') : '';
    if (has && d.dataset.key === key) return;      // Karten unverändert: laufendes Wischen nicht stören
    d.dataset.key = key;
    if (has) {
      // unterste Karte zuerst, damit die oberste zuletzt im DOM liegt
      d.replaceChildren(...deck.slice(0, 3).map((j, i) => card(j, i === 0)).reverse());
      return;
    }
    if (loading) { d.replaceChildren(state('Stellen werden geladen', `${profile.terms.length > 1 ? profile.terms.length + ' Suchbegriffe' : 'Die Suche'} für ${profile.name} ${profile.terms.length > 1 ? 'werden' : 'wird'} abgefragt.`)); return; }
    if (failed) { d.replaceChildren(state('Keine Verbindung zur Jobsuche', 'Der Proxy oder die Arbeitsagentur antwortet nicht (' + failed + ').', button('Erneut versuchen', () => loadMore(), true))); return; }
    d.replaceChildren(state('Stapel durchgesehen', 'Für ' + profile.name + ' gibt es hier gerade keine weiteren Stellen. Neue Anzeigen erscheinen automatisch beim nächsten Öffnen.',
      button('Ort oder Umkreis ändern', openSettings, true),
      button('Verworfene noch einmal zeigen', () => { store.seen = {}; save(); resetDeck(); })));
  }

  // ---------- Wischen ----------
  function drag(c) {
    let sx = 0, sy = 0, dx = 0, dy = 0, active = false, moved = false;
    const yes = c.querySelector('.stamp.yes'), no = c.querySelector('.stamp.no');
    c.addEventListener('pointerdown', e => {
      if (e.button) return;
      active = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0;
      c.classList.remove('back');
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e => {
      if (!active) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
      c.style.transform = `translate(${dx}px, ${dy * .25}px) rotate(${dx / 22}deg)`;
      yes.style.opacity = String(Math.max(0, Math.min(1, dx / 90)));
      no.style.opacity = String(Math.max(0, Math.min(1, -dx / 90)));
    });
    const end = () => {
      if (!active) return;
      active = false;
      if (!moved) { c.style.transform = ''; openDetails(deck[0]); return; }
      if (Math.abs(dx) > Math.min(110, innerWidth * .28)) { decide(dx > 0 ? 'yes' : 'no'); return; }
      c.classList.add('back');
      c.style.transform = ''; yes.style.opacity = no.style.opacity = '0';
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', () => { moved = true; dx = 0; end(); });
  }

  let busy = false;
  function decide(action) {
    const job = deck[0];
    if (!job || busy) return;
    busy = true;
    const c = $('deck').querySelector('.card.top');
    const done = () => {
      busy = false;
      deck.shift();
      if (action === 'yes') store.liked[job.refnr] = { ...job, gemerkt: Date.now() }; else store.seen[job.refnr] = 1;
      history.push({ job, action });
      if (history.length > 30) history.shift();
      save();
      render();
      if (deck.length < 6) loadMore();
    };
    if (!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return done();
    c.classList.add('fly');
    c.querySelector(action === 'yes' ? '.stamp.yes' : '.stamp.no').style.opacity = '1';
    c.style.transform = `translate(${action === 'yes' ? 140 : -140}%, 8%) rotate(${action === 'yes' ? 24 : -24}deg)`;
    c.style.opacity = '0';
    setTimeout(done, 260);
  }
  function undo() {
    const last = history.pop();
    if (!last) return;
    delete store.liked[last.job.refnr]; delete store.seen[last.job.refnr];
    deck.unshift(last.job);
    save(); render();
  }

  // ---------- Blätter (Details, Merkliste, Einstellungen) ----------
  let lastFocus = null;
  function openSheet(title, ...nodes) {
    lastFocus = document.activeElement;
    $('sheet-title').textContent = title;
    $('sheet-body').replaceChildren(...nodes);
    $('sheet-body').scrollTop = 0;
    $('panel').classList.remove('settle');
    $('panel').style.transform = ''; $('sheet').style.backgroundColor = '';
    $('sheet').hidden = false;
    $('sheet-close').focus();
  }
  function closeSheet() {
    $('sheet').hidden = true;
    $('panel').classList.remove('settle');
    $('panel').style.transform = ''; $('sheet').style.backgroundColor = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  // Blatt nach unten wegwischen: Das Blatt folgt dem Finger und schließt ab etwa einem Viertel seiner Höhe.
  (() => {
    const panel = $('panel'), body = $('sheet-body'), sheet = $('sheet');
    let startY = 0, startT = 0, offset = 0, base = 0, dragging = false, tracking = false, inBody = false;
    const place = y => {
      offset = Math.max(0, y);
      panel.style.transform = offset ? `translateY(${offset}px)` : '';
      sheet.style.backgroundColor = `rgba(10, 12, 18, ${(.5 * (1 - Math.min(1, offset / panel.offsetHeight))).toFixed(3)})`;
    };
    panel.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { tracking = false; return; }
      tracking = true; dragging = false; offset = 0;
      startY = e.touches[0].clientY; startT = e.timeStamp;
      inBody = body.contains(e.target);
      panel.classList.remove('settle');
    }, { passive: true });
    panel.addEventListener('touchmove', e => {
      if (!tracking) return;
      const dy = e.touches[0].clientY - startY;
      if (!dragging) {
        // Im Textbereich erst ziehen, wenn er ganz oben steht; sonst scrollt er normal.
        if (dy > 6 && (!inBody || body.scrollTop <= 0)) { dragging = true; base = dy; }
        else if (dy < -6 || (inBody && body.scrollTop > 0)) { tracking = false; return; }
        else return;
      }
      e.preventDefault();
      place(dy - base);
    }, { passive: false });
    const end = e => {
      if (!tracking || !dragging) { tracking = false; return; }
      tracking = dragging = false;
      const speed = offset / Math.max(1, e.timeStamp - startT);      // px pro ms
      const close = e.type !== 'touchcancel' && (offset > panel.offsetHeight * .25 || (offset > 40 && speed > .6));
      panel.classList.add('settle');
      if (!close) { place(0); sheet.style.backgroundColor = ''; return; }
      panel.style.transform = 'translateY(100%)';
      sheet.style.backgroundColor = 'rgba(10, 12, 18, 0)';
      setTimeout(() => { if (!sheet.hidden) closeSheet(); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 220);
    };
    panel.addEventListener('touchend', end);
    panel.addEventListener('touchcancel', end);
  })();
  function link(label, href, fill) { const a = el('a', 'btn' + (fill ? ' fill' : ''), label); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.style.textDecoration = 'none'; if (fill) a.style.color = '#fff'; return a; }

  function openDetails(job) {
    if (!job) return;
    const place = [job.plz, job.ort].filter(Boolean).join(' ');
    const sub = el('p', 'sub', [job.arbeitgeber, place, job.entfernung ? job.entfernung + ' km entfernt' : ''].filter(Boolean).join(' · '));
    const links = el('div', 'links');
    links.append(link('Anzeige bei der Arbeitsagentur', 'https://www.arbeitsagentur.de/jobsuche/jobdetail/' + encodeURIComponent(job.refnr), true));
    if (job.externeUrl) links.append(link('Originalanzeige', job.externeUrl));
    const desc = el('p', 'desc', 'Beschreibung wird geladen …');
    const more = el('details');
    more.hidden = true;
    openSheet(job.titel, sub, links, desc, more);
    loadDetails(job.refnr).then(d => {
      const text = d.stellenangebotsBeschreibung || d.stellenbeschreibung;
      desc.textContent = text || 'Für diese Stelle liefert die Arbeitsagentur keinen Beschreibungstext. Öffne die Anzeige über den Knopf oben.';
      const dl = el('dl');
      for (const [k, v] of Object.entries(d)) {
        if (/Beschreibung|KundennummerHash/i.test(k) || v == null || v === '' || typeof v === 'object') continue;
        dl.append(el('dt', null, k), el('dd', null, typeof v === 'boolean' ? (v ? 'ja' : 'nein') : String(v)));
      }
      if (dl.children.length) { more.append(el('summary', null, 'Alle Angaben der Schnittstelle'), dl); more.hidden = false; }
    }).catch(() => { desc.textContent = 'Die Details konnten nicht geladen werden. Öffne die Anzeige über den Knopf oben.'; });
  }

  function openSaved() {
    const jobs = Object.values(store.liked).sort((a, b) => (b.gemerkt || 0) - (a.gemerkt || 0));
    if (!jobs.length) return openSheet('Gemerkte Stellen', el('p', 'sub', 'Noch nichts gemerkt. Wische eine Stelle nach rechts oder tippe auf das Herz.'));
    const ul = el('ul', 'saved');
    for (const job of jobs) {
      const li = el('li');
      const p = PROFILES.find(x => x.id === job.profil);
      if (p) li.style.setProperty('--c', p.color);
      li.append(el('h3', null, job.titel));
      li.append(el('div', 'sub', [job.arbeitgeber, [job.plz, job.ort].filter(Boolean).join(' '), p ? p.name : ''].filter(Boolean).join(' · ')));
      const row = el('div', 'row');
      const a = el('a', null, 'Anzeige öffnen');
      a.href = 'https://www.arbeitsagentur.de/jobsuche/jobdetail/' + encodeURIComponent(job.refnr); a.target = '_blank'; a.rel = 'noopener';
      const det = el('button', null, 'Details'); det.type = 'button'; det.addEventListener('click', () => openDetails(job));
      const del = el('button', 'del', 'Entfernen'); del.type = 'button';
      del.addEventListener('click', () => { delete store.liked[job.refnr]; store.seen[job.refnr] = 1; save(); render(); openSaved(); });
      row.append(a, det, del);
      li.append(row);
      ul.append(li);
    }
    openSheet(`Gemerkte Stellen (${jobs.length})`, ul);
  }

  function openSettings() {
    const form = el('form');
    form.style.cssText = 'display:flex;flex-direction:column;gap:14px';
    const lo = el('label', null, 'Ort oder PLZ (leer = deutschlandweit)');
    const ort = el('input'); ort.type = 'text'; ort.id = 'set-ort'; ort.value = store.ort; ort.autocomplete = 'off'; lo.htmlFor = 'set-ort'; lo.append(ort);
    const lu = el('label', null, 'Umkreis');
    const um = el('select'); um.id = 'set-umkreis'; lu.htmlFor = 'set-umkreis';
    for (const [v, t] of [['0', 'nur dieser Ort'], ['10', '10 km'], ['25', '25 km'], ['50', '50 km'], ['100', '100 km'], ['200', '200 km']]) { const o = el('option', null, t); o.value = v; um.append(o); }
    um.value = store.umkreis; lu.append(um);
    const ok = button('Übernehmen und neu laden', () => {}, true); ok.type = 'submit';
    form.append(lo, lu, ok);
    form.addEventListener('submit', e => { e.preventDefault(); store.ort = ort.value.trim(); store.umkreis = um.value; save(); closeSheet(); renderChrome(); resetDeck(); });
    const terms = el('p', 'terms', `Suchbegriffe für ${profile.name}: ` + (profile.hint || profile.terms.join(', ')) + '. Zeitarbeit und private Arbeitsvermittler sind ausgeblendet.');
    const reset = button(`Verworfene Stellen wieder zeigen (${Object.keys(store.seen).length})`, () => { store.seen = {}; save(); closeSheet(); resetDeck(); });
    const src = el('p', 'terms', 'Daten: Jobsuche der Bundesagentur für Arbeit. Gemerkte und verworfene Stellen liegen nur in diesem Browser.');
    openSheet('Ort und Suche', form, terms, reset, src);
  }

  // ---------- Verdrahtung ----------
  $('yes').addEventListener('click', () => decide('yes'));
  $('no').addEventListener('click', () => decide('no'));
  $('undo').addEventListener('click', undo);
  $('info').addEventListener('click', () => openDetails(deck[0]));
  $('open-saved').addEventListener('click', openSaved);
  $('open-settings').addEventListener('click', openSettings);
  $('sheet-close').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', e => {
    if (!$('sheet').hidden) { if (e.key === 'Escape') closeSheet(); return; }
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') decide('yes');
    else if (e.key === 'ArrowLeft') decide('no');
    else if (e.key === 'ArrowUp') openDetails(deck[0]);
  });

  renderChrome();
  render();
  detectBase().then(resetDeck);
})();
</script>
</body>
</html>
