<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141b" media="(prefers-color-scheme: dark)">
<title>Jobstapel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jobstapel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: eine Bildschirmhöhe. Kopf, Filterleiste, Ansicht (Stapel oder Merkliste), Tab-Leiste unten. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --ink: #151821;
  --muted: #626a7a;
  --line: #dfe2ea;
  --accent: #2563c9;            /* Farbe der gewählten Berufsgruppe, per Script gesetzt */
  --yes: #17905b;
  --on-yes: #ffffff;
  --no: #d0453f;
  --shadow: 0 14px 34px rgba(21, 24, 33, .13);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141b; --surface: #1b202a; --ink: #f0f2f7; --muted: #9ba4b5; --line: #2d3441;
    --yes: #45c48c; --on-yes: #06281a; --no: #f37c76; --shadow: 0 14px 34px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141b; --surface: #1b202a; --ink: #f0f2f7; --muted: #9ba4b5; --line: #2d3441;
  --yes: #45c48c; --on-yes: #06281a; --no: #f37c76; --shadow: 0 14px 34px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; touch-action: pan-x pan-y; }
body {
  margin: 0; color: var(--ink); font: 500 16px/1.45 var(--font); overflow: hidden; overscroll-behavior: none;
  background: radial-gradient(130% 50% at 50% 0%, color-mix(in srgb, var(--accent) 18%, var(--bg)), var(--bg) 78%) fixed var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app {
  height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top)) 16px 0;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 1.3rem; letter-spacing: -.03em; margin: 0; }
.brand svg { width: 30px; height: 30px; }
.brand em { color: var(--accent); font-style: normal; }
.count { font-size: .84rem; color: var(--muted); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

.filter { position: relative; flex: none; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.filter svg { width: 22px; height: 22px; }
.filter b { position: absolute; top: -5px; right: -5px; background: var(--accent); color: #fff; border-radius: 999px; min-width: 1.6em; padding: 1px 5px; font-size: .72rem; text-align: center; }
.meta { margin: 0; font-size: .9rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.deck { position: relative; flex: 1; min-height: 0; }
.card {
  position: absolute; inset: 0 0 20px; background: var(--surface); border-radius: 26px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
  transform-origin: 50% 100%; will-change: transform; user-select: none; -webkit-user-select: none;
}
.card.top { touch-action: none; cursor: grab; animation: rise .24s ease-out; }
@keyframes rise { from { transform: translateY(10px) scale(.96); } to { transform: none; } }
.card.fly { transition: transform .28s ease-in, opacity .28s ease-in; }
.card.back { transition: transform .2s ease-out; }
.card:nth-last-child(2) { transform: translateY(10px) scale(.96); }
.card:nth-last-child(3) { transform: translateY(20px) scale(.92); }
.hero {
  position: relative; overflow: hidden; flex: none; padding: 16px 20px 22px; color: #fff;
  background:
    radial-gradient(60% 90% at 105% 110%, rgba(255, 255, 255, .22), transparent 70%),
    radial-gradient(45% 70% at -10% -20%, rgba(255, 255, 255, .16), transparent 70%),
    linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 66%, #000));
  display: flex; flex-direction: column; gap: 12px;
}
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .78rem; font-weight: 700; position: relative; z-index: 1; }
.eyebrow span { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .18); border-radius: 999px; padding: 4px 10px; }
.eyebrow .new { background: #fff; color: var(--accent); }
.hero .art { position: absolute; right: -18px; bottom: -30px; width: 150px; height: 150px; stroke: #fff; stroke-width: 1.3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: .2; transform: rotate(-10deg); pointer-events: none; }
.card h2 {
  position: relative; z-index: 1; color: #fff; margin: 0; letter-spacing: -.025em; font-weight: 800;
  font-size: clamp(1.3rem, 5.9vw, 1.8rem); line-height: 1.12;
  text-wrap: balance; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.body { padding: 16px 20px 0; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.org { display: flex; gap: 12px; align-items: center; flex: none; }
.badge {
  flex: none; width: 46px; height: 46px; border-radius: 14px; overflow: hidden; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 13%, var(--surface)); color: var(--accent); font-weight: 800; font-size: 1.15rem;
}
.badge img { width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 4px; }
.org .who { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.org .ort { font-size: .86rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.excerpt { margin: 0; color: var(--muted); font-size: .93rem; font-weight: 400; flex: 1; min-height: 0; overflow: hidden;
  -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); white-space: pre-line; }
.foot { padding: 10px 20px 18px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .78rem; font-weight: 600; background: var(--bg); border-radius: 999px; padding: 4px 11px; color: var(--muted); }
.tag.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.stamp {
  position: absolute; top: 24px; font-weight: 800; font-size: 1.4rem; text-transform: uppercase; letter-spacing: .04em; z-index: 2;
  border: 3px solid; border-radius: 12px; padding: 2px 12px; opacity: 0; background: var(--surface); pointer-events: none;
}
.stamp.yes { left: 18px; color: var(--yes); transform: rotate(-12deg); }
.stamp.no { right: 18px; color: var(--no); transform: rotate(12deg); }

.state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; color: var(--muted); }
.state svg.pic { width: 120px; height: 100px; }
.state strong { font-weight: 800; font-size: 1.25rem; color: var(--ink); letter-spacing: -.02em; }
.state p { margin: 0; max-width: 32ch; font-weight: 400; }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: .95rem; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.btn.fill { background: var(--accent); border-color: var(--accent); color: #fff; }

.actions { display: flex; justify-content: center; align-items: center; gap: 18px; flex: none; }
.round { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow); }
.round svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.round.no { color: var(--no); }
.round.yes { width: 72px; height: 72px; background: var(--yes); color: var(--on-yes); }
.round.yes svg { width: 32px; height: 32px; }
.round.small { width: 46px; height: 46px; color: var(--muted); box-shadow: none; border: 1px solid var(--line); }
.round.small svg { width: 20px; height: 20px; stroke-width: 2.2; }
.round:disabled { opacity: .35; cursor: default; }
.round:active:not(:disabled) { transform: scale(.93); }

/* Merkliste */
.saved-head { display: flex; align-items: center; gap: 12px; }
.saved-head .count { flex: 1; }
.saved-head .btn { align-self: center; background: var(--surface); }
.saved li.gone h3, .saved li.gone .sub { opacity: .55; }
.code { font: 500 .78rem/1.4 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
.file { position: absolute; opacity: 0; width: 1px; height: 1px; }
.result { font-weight: 700; margin: 0; }
.saved-head h2 { margin: 0; font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; }
.saved-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -16px; padding: 2px 16px 8px; overscroll-behavior: contain; position: relative; }
.saved { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.saved li { background: var(--surface); border-radius: 18px; display: flex; overflow: hidden; box-shadow: 0 4px 14px rgba(21, 24, 33, .06); }
.saved .bar { flex: none; width: 46px; background: var(--c); color: #fff; display: grid; place-items: center; }
.saved .main { flex: 1; min-width: 0; color: inherit; font: inherit; padding: 12px 6px 12px 14px; border: 0; background: none; text-align: left; display: flex; flex-direction: column; gap: 3px; }
.saved h3 { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; letter-spacing: -.01em; }
.saved .sub { font-size: .86rem; }
.saved .del { flex: none; border: 0; background: none; color: var(--muted); padding: 0 14px; display: grid; place-items: center; }

.fbar { display: flex; gap: 6px; overflow-x: auto; flex: none; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
.fbar::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 0; background: var(--surface); border-radius: 999px; padding: 7px 13px; font-weight: 600; font-size: .86rem; color: var(--muted); white-space: nowrap; }
.fchip[aria-pressed="true"] { background: var(--s, var(--accent)); color: #fff; }
.stline { display: flex; align-items: center; gap: 8px; margin-top: 4px; min-width: 0; }
.st { flex: none; font-size: .74rem; font-weight: 700; color: var(--s); background: color-mix(in srgb, var(--s) 13%, var(--surface)); border-radius: 999px; padding: 2px 9px; }
.note { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
.track { display: flex; flex-direction: column; gap: 10px; background: var(--bg); border-radius: 18px; padding: 14px; }
.track .fchip { background: var(--surface); }
.track .fchip[aria-pressed="true"] { background: var(--s); }
textarea { font: 500 1rem/1.4 var(--font); letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--bg); border: 1.5px solid transparent; border-radius: 14px; padding: 11px 13px; width: 100%; resize: vertical; }
.track textarea { background: var(--surface); }
textarea:focus { border-color: var(--accent); outline: none; }
.dots { display: flex; gap: 6px; }
.dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--accent); }
.ask { margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; background: var(--bg); border: 1.5px solid transparent; border-radius: 16px; padding: 13px 15px; min-height: 54px; }
.opt svg.i { width: 24px; height: 24px; color: var(--c, var(--accent)); }
.opt b { display: block; font-weight: 700; }
.opt small { display: block; font-size: .82rem; font-weight: 400; color: var(--muted); margin-top: 1px; }
.opt[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 12%, var(--surface)); }
.fchip.term { background: var(--bg); }
.fchip.term[aria-pressed="false"] { text-decoration: line-through; opacity: .6; }
.fchip.term[aria-pressed="true"] { background: var(--accent); color: #fff; }
.btn.quiet { border-color: transparent; background: var(--bg); align-self: flex-start; font-size: .9rem; padding: 9px 15px; }
.btn.danger { color: var(--no); }
.pick.sw { padding: 5px; } .pick.sw .dot { width: 28px; height: 28px; border-radius: 50%; display: block; }
.pick.sw:has(input:checked) { background: none; box-shadow: 0 0 0 3px var(--c); }
.pick.ic { padding: 9px; } .pick.ic span { display: grid; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Tab-Leiste */
.tabs { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border-top: 1px solid var(--line); margin: 0 -16px; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); }
.tab { border: 0; background: none; border-radius: 15px; padding: 9px 8px; font-weight: 700; font-size: .9rem; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; }
.tab[aria-current="page"] { background: color-mix(in srgb, var(--accent) 13%, var(--surface)); color: var(--accent); }
.tab b { background: var(--accent); color: #fff; border-radius: 999px; min-width: 1.6em; padding: 1px 6px; font-size: .76rem; text-align: center; font-variant-numeric: tabular-nums; }

/* Blatt (Details, Filter) */
.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: rgba(10, 12, 18, .5); }
.panel { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; border-radius: 26px 26px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.panel.settle { transition: transform .22s ease-out; }
.grip { flex: none; align-self: center; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin-top: 10px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 20px 10px; }
.panel-head h2 { font-weight: 800; font-size: 1.3rem; line-height: 1.18; letter-spacing: -.025em; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.close { flex: none; border: 0; background: var(--bg); border-radius: 50%; width: 38px; height: 38px; display: grid; place-items: center; color: var(--muted); }
.panel-body { overflow-y: auto; padding: 0 20px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; }
.sub { color: var(--muted); margin: 0; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-width: 65ch; font-weight: 400; }
.md { font-weight: 400; overflow-wrap: anywhere; max-width: 65ch; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h3 { font-size: 1.02rem; font-weight: 800; letter-spacing: -.01em; margin: 20px 0 6px; }
.md p { margin: 0 0 10px; }
.md ul { margin: 0 0 12px; padding-left: 1.15em; display: flex; flex-direction: column; gap: 4px; }
.md li::marker { color: var(--accent); }
.md strong { font-weight: 700; }
.links { display: flex; flex-wrap: wrap; gap: 10px; }
.facts { display: flex; flex-direction: column; gap: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.tile { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border-radius: 16px; padding: 10px 13px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile span, .group-label, legend, label { font-size: .76rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tile strong { font-weight: 700; line-height: 1.3; overflow-wrap: break-word; }
.card h2, .panel-head h2, .saved h3, .tile strong, .org .who, .tag, .opt b { -webkit-hyphens: auto; hyphens: auto; }
.group { display: flex; flex-direction: column; gap: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

form { display: flex; flex-direction: column; gap: 18px; }
label { display: flex; flex-direction: column; gap: 6px; }
input[type="text"], select { font: 600 1rem var(--font); letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--bg); border: 1.5px solid transparent; border-radius: 14px; padding: 11px 13px; width: 100%; }
input[type="text"]:focus, select:focus { border-color: var(--accent); outline: none; }
.two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; }
.pick { flex-direction: row; align-items: center; gap: 7px; font-size: .9rem; letter-spacing: 0; text-transform: none; color: var(--ink); font-weight: 600; background: var(--bg); border: 1.5px solid transparent; border-radius: 999px; padding: 8px 13px; cursor: pointer; }
.pick input { position: absolute; opacity: 0; width: 0; height: 0; }
.pick:has(input:checked) { background: color-mix(in srgb, var(--c, var(--accent)) 14%, var(--surface)); border-color: var(--c, var(--accent)); color: var(--c, var(--accent)); }
.pick:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.submitbar { position: sticky; bottom: 0; z-index: 1; display: flex; flex-direction: column; gap: 4px; margin: 0 -20px; padding: 12px 20px 10px; background: linear-gradient(transparent, var(--surface) 18px); }
.submitbar .btn.fill { justify-content: center; width: 100%; padding: 15px 18px; font-size: 1.05rem; font-weight: 800; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 40%, transparent); }
.textbtn { align-self: center; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: .88rem; padding: 8px 12px; text-decoration: underline; text-underline-offset: 3px; }
.small { font-size: .82rem; color: var(--muted); margin: 0; font-weight: 400; }
/* Installationshinweis und Update-Meldung */
.nag { flex: none; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; border-radius: 14px; padding: 9px 13px; font-size: .86rem; background: color-mix(in srgb, var(--accent) 13%, var(--surface)); color: var(--ink); }
.nag b { flex: 1; font-weight: 700; }
.nag span { color: var(--accent); font-weight: 700; white-space: nowrap; }
.update .btn { white-space: nowrap; padding: 9px 15px; font-size: .9rem; }
.update { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top)); width: min(94vw, 500px); display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: var(--shadow); border: 1px solid var(--line); font-weight: 700; font-size: .92rem; }
.gate { position: fixed; inset: 0; z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: radial-gradient(130% 50% at 50% 0%, color-mix(in srgb, var(--accent) 18%, var(--bg)), var(--bg) 78%) var(--bg); }
.gate-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding: calc(16px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); }
.gate h2 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.12; margin: 8px 0 0; text-wrap: balance; }
.box { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.box h3 { margin: 0; font-size: 1.05rem; font-weight: 800; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { position: relative; padding: 3px 0 3px 42px; min-height: 30px; }
.steps li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 13%, var(--surface)); color: var(--accent); font-weight: 800; display: grid; place-items: center; }
.steps svg.i { vertical-align: -4px; display: inline; }
.why { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.why li { position: relative; padding-left: 30px; font-weight: 400; }
.why li::before { content: "✓"; position: absolute; left: 0; top: 1px; width: 21px; height: 21px; border-radius: 50%; background: color-mix(in srgb, var(--yes) 18%, var(--surface)); color: var(--yes); display: grid; place-items: center; font-weight: 800; font-size: .78rem; }
.why b { font-weight: 700; }
.notice { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-radius: 16px; padding: 12px 14px; font-size: .9rem; font-weight: 400; margin: 0; }
.skip { align-self: center; border: 0; background: none; color: var(--muted); font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; padding: 10px; }
@media (prefers-reduced-motion: reduce) { .card.fly, .card.back, .panel.settle { transition: none; } .card.top { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="3" width="20" height="24" rx="6" fill="var(--accent)" opacity=".35" transform="rotate(9 17 15)"/><rect x="5" y="5" width="20" height="24" rx="6" fill="var(--accent)"/><path d="M15 21.5s-4.5-2.8-4.5-6.2a2.5 2.5 0 0 1 4.5-1.5 2.5 2.5 0 0 1 4.5 1.5c0 3.4-4.5 6.2-4.5 6.2z" fill="#fff"/></svg>
      <span>Job<em>stapel</em></span>
    </h1>
    <button type="button" class="filter" id="open-filter" aria-label="Filter">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <b id="filter-count" hidden>0</b>
    </button>
  </header>

  <button type="button" class="nag" id="nag" hidden><b>App nicht installiert</b><span>Installieren ›</span></button>

  <section class="view" id="view-deck">
    <p class="meta" id="meta" role="status"></p>
    <main class="deck" id="deck" aria-live="polite"></main>
    <div class="actions">
      <button type="button" class="round small" id="undo" aria-label="Letzte Entscheidung zurücknehmen" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button type="button" class="round no" id="no" aria-label="Verwerfen">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <button type="button" class="round yes" id="yes" aria-label="Merken">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
      </button>
      <button type="button" class="round small" id="info" aria-label="Details anzeigen">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
      </button>
    </div>
  </section>

  <section class="view" id="view-saved" hidden>
    <div class="saved-head"><h2>Gemerkt</h2><span class="count" id="saved-info"></span><button type="button" class="btn quiet" id="open-backup">Sichern</button></div>
    <div class="fbar" id="saved-filter" hidden></div>
    <div class="saved-scroll" id="saved-scroll"></div>
  </section>

  <nav class="tabs" aria-label="Hauptnavigation">
    <button type="button" class="tab" id="tab-deck">
      <svg class="i" viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="15" rx="3"/><path d="M8 3h8"/></svg>Entdecken
    </button>
    <button type="button" class="tab" id="tab-saved">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Gemerkt <b id="saved-count">0</b>
    </button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grip" aria-hidden="true"></div>
    <div class="panel-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="close" id="sheet-close" aria-label="Schließen"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="panel-body" id="sheet-body"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // Symbole für Berufe. Gespeichert wird nur der Name, nie die Zeichnung selbst.
  const ICONSET = {
    people: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.2c2.6.5 4.5 2.9 4.5 5.8"/>',
    chat: '<path d="M4 5h16v11H10l-6 4z"/><path d="M8 9h8M8 12h5"/>',
    doc: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    screen: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 9l3 2-3 2M12 13h4M8 21h8M12 17v4"/>',
    wrench: '<path d="M14.5 6.5a4 4 0 0 0 5 5L11 20a2.1 2.1 0 0 1-3-3z"/><path d="M14.5 6.5 17 4"/>',
    cart: '<path d="M3 4h2l2.5 11h10L20 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
    truck: '<path d="M2 6h11v10H2zM13 10h4l4 3v3h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
    book: '<path d="M4 5c3-1 5-1 8 1 3-2 5-2 8-1v13c-3-1-5-1-8 1-3-2-5-2-8-1z"/><path d="M12 6v13"/>',
    leaf: '<path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/>',
    heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
    box: '<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
    cross: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
    fork: '<path d="M7 3v7a2 2 0 0 0 4 0V3M9 3v18M17 3c-2 2-2 6 0 8v10"/>',
    spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
    star: '<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z"/>',
  };
  const COLORS = ['#d4482b', '#b22f82', '#a26400', '#17905b', '#2563c9', '#6b4bd6', '#0e8a9a', '#59616f'];
  // Vorgaben für Berufe: Hinter jedem stecken mehrere Suchbegriffe, die einzeln abgefragt und zusammengeführt werden.
  // Nutzer können sie in der App ändern und eigene Berufe anlegen; das liegt dann im Browser-Speicher.
  const DEFAULT_PROFILES = [
    { id: 'sozial', name: 'Erzieher & HEP', color: '#d4482b', icon: 'people', exclude: [],
      terms: ['Heilerziehungspfleger', 'Erzieher', 'Pädagogische Fachkraft', 'Heilpädagoge', 'Kindheitspädagoge', 'Betreuungsfachkraft Eingliederungshilfe'] },
    { id: 'social', name: 'Social Media', color: '#b22f82', icon: 'chat', exclude: [],
      terms: ['Social Media Manager', 'Online Marketing Manager', 'Content Manager', 'Community Manager', 'Content Creator', 'Marketing Manager Kommunikation', 'Referent Öffentlichkeitsarbeit'] },
    { id: 'buero', name: 'Sachbearbeitung', color: '#a26400', icon: 'doc', exclude: [],
      terms: ['Sachbearbeiter Vertriebsinnendienst', 'Vertriebsassistent', 'Kaufmännischer Mitarbeiter Vertrieb', 'Sachbearbeiter Auftragsabwicklung', 'Medienkaufmann', 'Verlag', 'Redakteur', 'Journalist', 'Lektor', 'Redaktionsassistent'] },
    { id: 'neben', name: 'Nebenjobs', color: '#17905b', icon: 'clock', exclude: [], terms: [], minijob: true },
    // include: Eine Stelle erscheint nur, wenn Titel oder Berufsbezeichnung eines dieser Wörter enthält.
    // Die Jobsuche findet sonst auch Stellen, die den Suchbegriff nur irgendwo im Text nennen.
    { id: 'it', name: 'IT', color: '#2563c9', icon: 'screen', exclude: [],
      include: ['IT', 'EDV', 'Admin', 'System', 'Netzwerk', 'Informat', 'Security', 'Cloud', 'DevOps', 'Microsoft', 'M365', 'Infrastruktur', 'Software', 'Support', 'Helpdesk', 'Linux', 'Windows', 'Server', 'Daten', 'Data', 'Digital'],
      terms: ['Systemadministrator', 'IT-Administrator', 'IT-Leiter', 'System Engineer', 'Security Engineer', 'IT-Sicherheit', 'Microsoft 365', 'Cloud Engineer', 'Netzwerkadministrator', 'IT-Koordinator'] },
    // Breites Profil für den beruflichen Neustart mit handwerklicher und/oder sozialer Stärke, quer durch alle Branchen:
    // Einstiegs- und Helferstellen, Haus- und Betriebstechnik, Fahren und Logistik, Betreuung ohne Fachabschluss,
    // Anleiten (Handwerk + Soziales zugleich) und Service. Voll- und Teilzeit, Mini- und Aushilfsjobs ausgeblendet.
    { id: 'neustart', name: 'Neustart 50+', color: '#0e8a9a', icon: 'wrench', arbeitszeit: ['vz', 'tz'],
      exclude: ['Minijob', 'geringfügig', 'Aushilfe', 'Werkstudent', 'Praktik', 'Ferienjob', 'Schüler', 'Student'],
      terms: ['Quereinsteiger', 'Helfer', 'Hausmeister', 'Haustechniker', 'Instandhaltung', 'Monteur', 'Servicetechniker', 'Produktionsmitarbeiter', 'Maschinenbediener',
        'Lagermitarbeiter', 'Kraftfahrer', 'Fahrer', 'Busfahrer', 'Zusteller', 'Bauhof', 'Garten- und Landschaftsbau', 'Reinigungskraft', 'Hauswirtschaft', 'Küchenhilfe',
        'Betreuungskraft', 'Alltagsbegleiter', 'Schulbegleiter', 'Integrationshelfer', 'Pflegehelfer', 'Sozialbetreuer', 'Arbeitsanleiter', 'Arbeitserzieher',
        'Gruppenleiter Werkstatt für behinderte Menschen', 'Ausbilder', 'Verkäufer', 'Kundenservice', 'Servicekraft', 'Sicherheitsmitarbeiter', 'Pförtner'] },
  ];
  // Bewerbungsstufen in der Merkliste
  const STATUS = [['gemerkt', 'Gemerkt', '#59616f'], ['beworben', 'Beworben', '#2563c9'], ['gespraech', 'Gespräch', '#a26400'], ['zusage', 'Zusage', '#17905b'], ['absage', 'Absage', '#d0453f']];
  const statusOf = job => STATUS.find(x => x[0] === job.status) || STATUS[0];
  const AZ = [['vz', 'Vollzeit'], ['tz', 'Teilzeit'], ['ho', 'Homeoffice'], ['snw', 'Schicht, Nacht, Wochenende'], ['mj', 'Minijob']];
  const WORKER = 'https://jobs-ba-api.micana.workers.dev/';
  const SIZE = 25;
  const KEY = 'jobstapel-v1';

  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  // Icons stammen nur aus den festen Zeichenketten oben, nie aus API-Daten.
  function icon(paths, cls) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', cls || 'i'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = paths;
    return s;
  }
  const ICON = {
    pin: '<path d="M12 21s-6-5.4-6-10a6 6 0 0 1 12 0c0 4.6-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    out: '<path d="M14 5h5v5M19 5l-8 8M11 7H6v11h11v-5"/>',
    stack: '<rect x="5" y="6" width="14" height="15" rx="3"/><path d="M8 3h8"/>',
  };

  // ---------- Speicher (nur in diesem Browser) ----------
  const store = { ort: 'Dresden', umkreis: '25', profil: 'sozial', profiles: null, known: null, visit: 0, prevVisit: 0, liked: {}, seen: {}, az: [], befristung: '', seit: '', ohneZeitarbeit: true, ohnePav: true, hinted: false };
  let firstStart = false;
  try { firstStart = !localStorage.getItem(KEY) && !localStorage.getItem('jobstapel.onboarded'); } catch (e) {}
  try { Object.assign(store, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const cleanList = v => (Array.isArray(v) ? v : []).map(x => String(x).trim()).filter(Boolean).slice(0, 40);
  const cleanProfile = p => ({
    id: String(p.id || 'p' + Date.now().toString(36)), name: String(p.name || 'Beruf').slice(0, 40),
    color: COLORS.includes(p.color) ? p.color : COLORS[0], icon: ICONSET[p.icon] ? p.icon : 'star',
    terms: cleanList(p.terms), exclude: cleanList(p.exclude), include: cleanList(p.include), minijob: !!p.minijob,
    arbeitszeit: (Array.isArray(p.arbeitszeit) ? p.arbeitszeit : []).filter(c => AZ.some(a => a[0] === c)),   // Vorgabe, solange im Filter keine Arbeitszeit gewählt ist
  });
  if (!Array.isArray(store.profiles) || !store.profiles.length) store.profiles = DEFAULT_PROFILES;
  else {
    // Später hinzugekommene Vorgaben einmalig ergänzen; selbst gelöschte kommen nicht wieder.
    const known = Array.isArray(store.known) ? store.known : ['sozial', 'social', 'buero', 'neben', 'it'];
    for (const d of DEFAULT_PROFILES) if (!known.includes(d.id) && !store.profiles.some(x => x && x.id === d.id)) store.profiles.push(d);
  }
  store.known = DEFAULT_PROFILES.map(d => d.id);
  // Vorgaben, die später Muss-Wörter bekommen haben, einmalig nachrüsten
  for (const x of store.profiles) { const d = x && DEFAULT_PROFILES.find(y => y.id === x.id); if (d && d.include && x.include === undefined) x.include = d.include; }
  store.profiles = store.profiles.map(cleanProfile);
  const PROFILES = store.profiles;                    // dieselbe Liste; Änderungen werden mit save() gespeichert
  const pic = p => ICONSET[p.icon] || ICONSET.star;
  if (!PROFILES.some(p => p.id === store.profil)) store.profil = PROFILES[0].id;
  // Besuche: Was nach dem vorigen Besuch veröffentlicht wurde, gilt als neu
  if (!store.visit || Date.now() - store.visit > 30 * 60 * 1000) { store.prevVisit = store.visit || 0; store.visit = Date.now(); }
  const sinceDay = store.prevVisit ? new Date(store.prevVisit).toISOString().slice(0, 10) : '';
  if (!Array.isArray(store.az)) store.az = [];
  function save() {
    const keys = Object.keys(store.seen);
    if (keys.length > 4000) for (const k of keys.slice(0, keys.length - 3000)) delete store.seen[k];
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }
  const activeFilters = () => store.az.length + (store.befristung ? 1 : 0) + (store.seit ? 1 : 0);

  // ---------- API ----------
  let base = WORKER;
  async function detectBase() {
    // Läuft die Seite über "python3 jobsuche.py serve", wird dessen lokaler Proxy genutzt.
    if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
    try { const r = await fetch('api/ping', { cache: 'no-store' }); if (r.ok && (await r.json()).ok) base = ''; } catch (e) {}
  }
  async function api(path) {
    const r = await fetch(base + path);
    if (!r.ok) throw Object.assign(new Error('Fehler ' + r.status), { status: r.status });
    return r;
  }
  const details = new Map();
  function loadDetails(refnr) {
    if (!details.has(refnr)) {
      details.set(refnr, api('api/jobdetails/' + encodeURIComponent(refnr)).then(r => r.json()).catch(e => { details.delete(refnr); throw e; }));
    }
    return details.get(refnr);
  }
  const logos = new Map();
  function loadLogo(hash) {
    if (!logos.has(hash)) {
      logos.set(hash, api('api/logo/' + encodeURIComponent(hash)).then(r => r.blob()).then(b => URL.createObjectURL(b)).catch(() => null));
    }
    return logos.get(hash);
  }

  // ---------- Stapel ----------
  let profile = PROFILES.find(p => p.id === store.profil);
  let deck = [], inDeck = new Set(), pageNo = 0, exhausted = false, loading = false, failed = '', failedStatus = 0, rawTotal = 0, run = 0;
  const history = [];

  const fmtDate = s => { const d = new Date(s); return !s || isNaN(d) ? '' : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
  const startText = s => { const d = new Date(s); return !s || isNaN(d) ? '' : d.getTime() <= Date.now() ? 'ab sofort' : fmtDate(s); };
  const isNew = s => { const d = new Date(s); return !isNaN(d) && Date.now() - d.getTime() < 3 * 864e5; };
  const time = j => { const d = new Date(j.aktuelleVeroeffentlichungsdatum); return isNaN(d) ? 0 : d.getTime(); };

  // Kurze Wörter wie „IT“ nur als ganzes Wort werten (sonst träfe es „Mitarbeiter“), längere als Wortteil.
  const hasWord = (text, w) => w.length <= 3 ? new RegExp('(^|[^A-Za-zÄÖÜäöüß])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^A-Za-zÄÖÜäöüß])').test(text) : text.toLowerCase().includes(w.toLowerCase());
  function fits(job, p) {
    const all = `${job.titel} · ${job.beruf || ''} · ${job.arbeitgeber}`;
    if (p.exclude.some(w => hasWord(all, w))) return false;
    if (p.include.length && !p.include.some(w => hasWord(`${job.titel} · ${job.beruf || ''}`, w))) return false;
    return true;
  }

  function slim(job, term) {
    const o = job.arbeitsort || {};
    return {
      refnr: job.refnr || job.referenznummer || '', titel: job.titel || job.beruf || '(ohne Titel)',
      arbeitgeber: job.arbeitgeber || '', plz: o.plz || '', ort: o.ort || '',
      entfernung: Number(o.entfernung) > 0 ? Math.round(Number(o.entfernung)) : 0,
      aktuelleVeroeffentlichungsdatum: job.aktuelleVeroeffentlichungsdatum || '', eintrittsdatum: job.eintrittsdatum || '',
      beruf: job.beruf || '', kundennummerHash: job.kundennummerHash || '', externeUrl: /^https?:\/\//i.test(job.externeUrl || '') ? job.externeUrl : '',
      term, profil: profile.id,
      fresh: !!sinceDay && String(job.aktuelleVeroeffentlichungsdatum || '').slice(0, 10) >= sinceDay,
    };
  }

  async function loadMore() {
    if (loading || exhausted) return;
    loading = true; failed = '';
    const my = run;
    render();
    let tries = 0;
    while (my === run && !exhausted && deck.length < 6 && tries++ < 4) {
      pageNo++;
      const terms = profile.terms.length ? profile.terms : [''];
      const az = profile.minijob ? ['mj'] : store.az.length ? store.az : profile.arbeitszeit;
      const query = async term => {
        const p = new URLSearchParams({ angebotsart: '1', page: String(pageNo), size: String(SIZE) });
        if (store.ohneZeitarbeit) p.set('zeitarbeit', 'false');
        if (store.ohnePav) p.set('pav', 'false');
        if (az.length) p.set('arbeitszeit', az.join(';'));
        if (store.befristung) p.set('befristung', store.befristung);
        if (store.seit) p.set('veroeffentlichtseit', store.seit);
        if (term) p.set('was', term);
        if (store.ort.trim()) { p.set('wo', store.ort.trim()); p.set('umkreis', store.umkreis); }
        const data = await (await api('api/jobs?' + p)).json();
        return { term, data };
      };
      // Viele Suchbegriffe nicht alle gleichzeitig abfragen, sondern in Sechsergruppen
      const results = [];
      for (let i = 0; i < terms.length && my === run; i += 6) results.push(...await Promise.allSettled(terms.slice(i, i + 6).map(query)));
      if (my !== run) return;
      const ok = results.filter(r => r.status === 'fulfilled').map(r => r.value);
      if (!ok.length) { failed = String(results[0].reason?.message || results[0].reason || 'unbekannt'); failedStatus = Number(results[0].reason?.status) || 0; pageNo--; break; }
      let full = false;
      const batch = [];
      for (const { term, data } of ok) {
        const list = data.stellenangebote || [];
        rawTotal += list.length;
        if (list.length >= SIZE && (Number(data.maxErgebnisse) || 0) > pageNo * SIZE) full = true;
        for (const raw of list) {
          const job = slim(raw, term);
          if (!job.refnr || inDeck.has(job.refnr) || store.seen[job.refnr] || store.liked[job.refnr]) continue;
          if (!fits(job, profile)) continue;            // Ausschluss- und Muss-Wörter
          inDeck.add(job.refnr);
          batch.push(job);
        }
      }
      batch.sort((a, b) => time(b) - time(a));
      deck.push(...batch);
      if (!full) exhausted = true;
    }
    if (my !== run) return;
    loading = false;
    render();
  }

  function resetDeck() {
    run++;
    deck = []; inDeck = new Set(); pageNo = 0; exhausted = false; loading = false; failed = ''; failedStatus = 0; rawTotal = 0; history.length = 0;
    loadMore();
  }

  // ---------- Darstellung ----------
  let view = 'deck';
  function renderChrome() {
    document.documentElement.style.setProperty('--accent', profile.color);
    const n = activeFilters();
    $('filter-count').textContent = String(n); $('filter-count').hidden = n === 0;
    $('view-deck').hidden = view !== 'deck';
    $('view-saved').hidden = view !== 'saved';
    for (const [id, v] of [['tab-deck', 'deck'], ['tab-saved', 'saved']]) {
      if (view === v) $(id).setAttribute('aria-current', 'page'); else $(id).removeAttribute('aria-current');
    }
    renderCounts();
  }
  function renderCounts() {
    const liked = Object.keys(store.liked).length;
    $('saved-count').textContent = String(liked);
    $('saved-count').hidden = liked === 0;
    const ort = store.ort.trim();
    const parts = ort ? [ort, store.umkreis === '0' ? 'nur dort' : store.umkreis + ' km'] : ['Deutschlandweit'];
    if (deck.length) parts.push(`${deck.length}${exhausted ? '' : '+'} offene Stellen`);
    const fresh = deck.filter(j => j.fresh).length;
    if (fresh) parts.push(`${fresh} neu seit letztem Besuch`);
    $('meta').textContent = parts.join(' · ');
  }
  function show(v) {
    view = v;
    if (v === 'saved') { renderSaved(); checkSaved(); }
    renderChrome();
    const hash = v === 'saved' ? '#gemerkt' : '';

  }

  function card(job, top) {

    c.append(hero, body, foot, el('span', 'stamp yes', 'Merken'), el('span', 'stamp no', 'Weg'));

  function picture() {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');

      + '<rect x="32" y="14" width="56" height="72" rx="12" fill="var(--accent)"/>'
      + '<path d="M60 62s-11-6.8-11-15a6 6 0 0 1 11-3.6A6 6 0 0 1 71 47c0 8.2-11 15-11 15z" fill="#fff"/>';

  function button(label, fn, fill) { const b = el('button', 'btn' + (fill ? ' fill' : ''), label); b.type = 'button'; b.addEventListener('click', fn); return b; }

  function render() {
    const d = $('deck');
    const has = deck.length > 0;
    $('yes').disabled = $('no').disabled = $('info').disabled = !has;
    $('undo').disabled = history.length === 0;
    renderCounts();
    const key = has ? deck.slice(0, 3).map(j => j.refnr).join('|') : '';
    if (has && d.dataset.key === key) return;      // Karten unverändert: laufendes Wischen nicht stören
    d.dataset.key = key;

      d.replaceChildren(...deck.slice(0, 3).map((j, i) => card(j, i === 0)).reverse());

    }
    if (loading) { d.replaceChildren(state('Stellen werden geladen', `Einen Moment, die Jobsuche für ${profile.name} läuft.`)); return; }
    // Die Jobsuche kennt kleine Ortsteile oft nicht: Dann kommt gar nichts zurück (oder ein Fehler 400).
    const ort = store.ort.trim();
    if (ort && ((failed && failedStatus === 400) || (!failed && rawTotal === 0))) {
      d.replaceChildren(state(`Nichts gefunden für „${ort}“`,
        'Kleine Ortsteile kennt die Jobsuche oft nicht. Trag die Postleitzahl oder die nächste größere Gemeinde ein. Stimmt der Ort, hilft ein größerer Umkreis.',

    d.replaceChildren(state('Alles durchgesehen', 'Für ' + profile.name + ' gibt es mit diesen Filtern gerade keine weiteren Stellen.',

  // ---------- Wischen ----------
  function drag(c) {
    let sx = 0, sy = 0, dx = 0, dy = 0, active = false, moved = false;
    const yes = c.querySelector('.stamp.yes'), no = c.querySelector('.stamp.no');
    c.addEventListener('pointerdown', e => {
      if (e.button) return;
      active = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0;
      c.classList.remove('back'); c.style.animation = 'none';
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener('pointermove', e => {
      if (!active) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
      c.style.transform = `translate(${dx}px, ${dy * .25}px) rotate(${dx / 22}deg)`;
      yes.style.opacity = String(Math.max(0, Math.min(1, dx / 90)));
      no.style.opacity = String(Math.max(0, Math.min(1, -dx / 90)));
    });
    const end = () => {
      if (!active) return;
      active = false;
      if (!moved) { c.style.transform = ''; openDetails(deck[0]); return; }
      if (Math.abs(dx) > Math.min(110, innerWidth * .28)) { decide(dx > 0 ? 'yes' : 'no'); return; }
      c.classList.add('back');
      c.style.transform = ''; yes.style.opacity = no.style.opacity = '0';
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', () => { moved = true; dx = 0; end(); });
  }

  let busy = false;
  function decide(action) {
    const job = deck[0];
    if (!job || busy || view !== 'deck') return;
    busy = true;
    const c = $('deck').querySelector('.card.top');
    const done = () => {
      busy = false;
      deck.shift();
      if (action === 'yes') store.liked[job.refnr] = { ...job, gemerkt: Date.now() }; else store.seen[job.refnr] = 1;
      store.hinted = true;
      history.push({ job, action });
      if (history.length > 30) history.shift();
      save();
      render();
      if (deck.length < 6) loadMore();
    };
    if (!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return done();
    c.style.animation = 'none';
    c.classList.add('fly');
    c.querySelector(action === 'yes' ? '.stamp.yes' : '.stamp.no').style.opacity = '1';
    c.style.transform = `translate(${action === 'yes' ? 140 : -140}%, 8%) rotate(${action === 'yes' ? 24 : -24}deg)`;
    c.style.opacity = '0';
    setTimeout(done, 260);
  }
  function undo() {
    const last = history.pop();
    if (!last) return;
    delete store.liked[last.job.refnr]; delete store.seen[last.job.refnr];
    deck.unshift(last.job);
    save(); render();
  }

  // ---------- Merkliste (eigener Tab) ----------
  let savedFilter = '';
  function renderSaved() {
    const all = Object.values(store.liked).sort((a, b) => (b.gemerkt || 0) - (a.gemerkt || 0));
    $('saved-info').textContent = all.length === 1 ? '1 Stelle' : `${all.length} Stellen`;
    const box = $('saved-scroll');
    if (!all.length) {
      $('saved-filter').hidden = true;
      box.replaceChildren(state('Noch nichts gemerkt', 'Wische im Stapel eine Stelle nach rechts oder tippe auf das Herz.', button('Zum Stapel', () => show('deck'), true)));

    }

    if (savedFilter && !all.some(j => statusOf(j)[0] === savedFilter)) savedFilter = '';

    $('saved-filter').hidden = chips.length < 3;
    $('saved-filter').replaceChildren(...chips.map(([id, name, n]) => {
      const b = el('button', 'fchip', `${name} ${n}`);
      b.type = 'button'; b.setAttribute('aria-pressed', String(savedFilter === id));
      b.addEventListener('click', () => { savedFilter = id; renderSaved(); });

    }));
    const jobs = savedFilter ? all.filter(j => statusOf(j)[0] === savedFilter) : all;
    const ul = el('ul', 'saved');
    for (const job of jobs) {
      const p = PROFILES.find(x => x.id === job.profil) || { color: '#59616f', icon: 'star' };
      const st = statusOf(job);
      const li = el('li');
      li.style.setProperty('--c', p.color);
      const bar = el('span', 'bar');
      bar.append(icon(pic(p)));
      const main = el('button', 'main');
      main.type = 'button';
      main.append(el('h3', null, job.titel), el('span', 'sub', [job.arbeitgeber, [job.plz, job.ort].filter(Boolean).join(' ')].filter(Boolean).join(' · ')));
      const line = el('span', 'stline');
      if (job.gone) li.classList.add('gone');
      const pill = el('span', 'st', st[1] + (job.statusAt && st[0] !== 'gemerkt' ? ' · ' + fmtDate(job.statusAt) : ''));
      pill.style.setProperty('--s', st[2]);
      line.append(pill);
      if (job.gone) { const g = el('span', 'st', 'Nicht mehr online'); g.style.setProperty('--s', '#59616f'); line.append(g); }
      if (job.note) line.append(el('span', 'note', job.note));
      main.append(line);
      main.addEventListener('click', () => openDetails(job));
      const del = el('button', 'del');
      del.type = 'button'; del.setAttribute('aria-label', 'Aus der Merkliste entfernen');
      del.append(icon(ICON.x));
      del.addEventListener('click', () => { delete store.liked[job.refnr]; store.seen[job.refnr] = 1; save(); renderSaved(); renderCounts(); });
      li.append(bar, main, del);
      ul.append(li);
    }
    const stale = all.filter(j => j.gone && statusOf(j)[0] === 'gemerkt');
    const nodes = [ul];
    if (stale.length) {
      const clear = button(stale.length === 1 ? '1 abgelaufene Stelle entfernen' : `${stale.length} abgelaufene Stellen entfernen`, () => {
        for (const j of stale) { delete store.liked[j.refnr]; store.seen[j.refnr] = 1; }
        save(); renderSaved(); renderCounts();
      });
      clear.classList.add('quiet'); clear.style.marginTop = '12px';
      nodes.push(clear);

    box.replaceChildren(...nodes);
  }

  // Prüft höchstens einmal am Tag je Stelle, ob sie bei der Arbeitsagentur noch online ist (Fehler 404/410 = entfernt).
  let checking = false;
  async function checkSaved() {
    if (checking) return;
    checking = true;
    const due = Object.values(store.liked).filter(j => !j.checked || Date.now() - j.checked > 864e5).slice(0, 40);
    let changed = false;
    const work = async job => {
      try { await loadDetails(job.refnr); if (job.gone) { job.gone = false; changed = true; } job.checked = Date.now(); }
      catch (e) { if (e.status === 404 || e.status === 410) { if (!job.gone) changed = true; job.gone = true; job.checked = Date.now(); } }
    };
    for (let i = 0; i < due.length; i += 3) await Promise.all(due.slice(i, i + 3).map(work));
    checking = false;
    if (due.length) save();
    if (changed && view === 'saved') renderSaved();
  }

  // Bewerbungsstufe und Notiz für eine gemerkte Stelle (im Detailblatt)
  function trackNodes(saved) {
    const box = el('div', 'track');
    const row = el('div', 'chips');
    const paint = () => row.replaceChildren(...STATUS.map(([id, name, color]) => {
      const b = el('button', 'fchip', name);
      b.type = 'button'; b.style.setProperty('--s', color);
      b.setAttribute('aria-pressed', String(statusOf(saved)[0] === id));
      b.addEventListener('click', () => { saved.status = id; saved.statusAt = Date.now(); save(); paint(); if (view === 'saved') renderSaved(); });
      return b;
    }));
    paint();
    const note = el('textarea');
    note.id = 'track-note'; note.rows = 2; note.maxLength = 500; note.value = saved.note || '';
    note.placeholder = 'Notiz, z. B. Ansprechpartner oder Termin';
    note.addEventListener('input', () => { saved.note = note.value.trim(); save(); });
    note.addEventListener('change', () => { if (view === 'saved') renderSaved(); });
    const l = el('label', null, 'Notiz'); l.htmlFor = note.id; l.append(note);
    box.append(el('span', 'group-label', 'Bewerbung'), row, l);
    return box;
  }

  // ---------- Blatt (Details, Filter) ----------
  let lastFocus = null;
  function openSheet(title, ...nodes) {
    lastFocus = document.activeElement;
    $('sheet-title').textContent = title;
    $('sheet-body').replaceChildren(...nodes);
    $('panel').classList.remove('settle');
    $('panel').style.transform = ''; $('sheet').style.backgroundColor = '';
    $('sheet').hidden = false;
    $('sheet-body').scrollTop = 0;                    // erst nach dem Einblenden, vorher bleibt die alte Position stehen

  function closeSheet() {
    $('sheet').hidden = true;
    $('panel').classList.remove('settle');
    $('panel').style.transform = ''; $('sheet').style.backgroundColor = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  // Blatt nach unten wegwischen: Es folgt dem Finger und schließt ab etwa einem Viertel seiner Höhe.
  (() => {
    const panel = $('panel'), body = $('sheet-body'), sheet = $('sheet');
    let startY = 0, startT = 0, offset = 0, base0 = 0, dragging = false, tracking = false, inBody = false;
    const place = y => {
      offset = Math.max(0, y);
      panel.style.transform = offset ? `translateY(${offset}px)` : '';
      sheet.style.backgroundColor = `rgba(10, 12, 18, ${(.5 * (1 - Math.min(1, offset / panel.offsetHeight))).toFixed(3)})`;
    };
    panel.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { tracking = false; return; }
      tracking = true; dragging = false; offset = 0;
      startY = e.touches[0].clientY; startT = e.timeStamp;
      inBody = body.contains(e.target);
      panel.classList.remove('settle');
    }, { passive: true });
    panel.addEventListener('touchmove', e => {
      if (!tracking) return;
      const dy = e.touches[0].clientY - startY;
      if (!dragging) {
        // Im Textbereich erst ziehen, wenn er ganz oben steht; sonst scrollt er normal.
        if (dy > 6 && (!inBody || body.scrollTop <= 0)) { dragging = true; base0 = dy; }
        else if (dy < -6 || (inBody && body.scrollTop > 0)) { tracking = false; return; }
        else return;
      }
      e.preventDefault();
      place(dy - base0);
    }, { passive: false });
    const end = e => {
      if (!tracking || !dragging) { tracking = false; return; }
      tracking = dragging = false;
      const speed = offset / Math.max(1, e.timeStamp - startT);      // px pro ms
      const close = e.type !== 'touchcancel' && (offset > panel.offsetHeight * .25 || (offset > 40 && speed > .6));
      panel.classList.add('settle');
      if (!close) { place(0); sheet.style.backgroundColor = ''; return; }
      panel.style.transform = 'translateY(100%)';
      sheet.style.backgroundColor = 'rgba(10, 12, 18, 0)';
      setTimeout(() => { if (!sheet.hidden) closeSheet(); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 220);
    };
    panel.addEventListener('touchend', end);
    panel.addEventListener('touchcancel', end);
  })();

  function link(label, href, fill) {
    const a = el('a', 'btn' + (fill ? ' fill' : ''), label);
    a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.append(icon(ICON.out));
    return a;
  }

  // ---------- Beschreibungstexte aufräumen ----------
  // Die Texte kommen als Mischung aus Markdown und HTML-Zeichencodes. Sie werden hier in sauberes HTML übersetzt.
  const decoder = document.createElement('textarea');
  function clean(raw) {
    decoder.innerHTML = String(raw || '');                 // löst &#160; und ähnliche Zeichencodes auf, führt nichts aus
    // Maskierte Zeichen wie \* (z. B. in "Pfleger\*in") werden geschützt, damit sie nicht als Formatierung gelten.
    return decoder.value.replace(/\\([\\()\[\]*_#.!+\-])/g, (_, c) => String.fromCharCode(0xE000 + c.charCodeAt(0)))
      .replace(/\uE02A{2,}/g, ' ')                         // Ketten wie \*\*\*\* sind Füllzeichen
      .replace(/\r/g, '').replace(/[\u00a0\t ]+/g, ' ').replace(/\*{2,3} *\*{2,3}/g, '')
      .split('\n').map(l => l.trim()).join('\n');
  }
  const unesc = t => t.replace(/[\uE000-\uE0FF]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xE000));
  function safeUrl(u) {
    u = unesc(u).replace(/^https?:\/\/mailto:/i, 'mailto:');
    return /^(https?:\/\/|mailto:)/i.test(u) ? u : '';
  }
  function inline(text, into) {
    // Reihenfolge: [Text](Link), **fett**, nackte Links
    const re = /\[([^\]]+)\]\(([^)\s]+)\)|\*{2,3}((?:[^*]|\*(?!\*))+?)\*{2,3}|(https?:\/\/[^\s)<>]+[^\s)<>.,;:!?])|([\w.+-]+@[\w-]+(?:\.[\w-]+)+)/g;
    let last = 0, m;
    // Übrig gebliebene Formatierungs-Sternchen entfernen; ein Stern zwischen Buchstaben (Pfleger*in) bleibt.
    const plain = t => {
      t = unesc(t.replace(/\*{2,3}/g, '').replace(/(?<![A-Za-zÄÖÜäöüß])\*|\*(?![A-Za-zÄÖÜäöüß])/g, ''));
      if (t) into.append(document.createTextNode(t));
    };
    while ((m = re.exec(text))) {
      plain(text.slice(last, m.index));
      last = re.lastIndex;
      if (m[1] != null || m[4] != null || m[5] != null) {
        const url = safeUrl(m[5] != null ? 'mailto:' + m[5] : (m[2] || m[4]));
        const short = u => u.replace(/^https?:\/\/(www\.)?/, '').replace(/[/?#].*$/, '');
        let label = m[5] != null ? m[5] : m[1] != null ? unesc(m[1].replace(/\*/g, '')).trim() : short(m[4]);
        if (/^https?:\/\//i.test(label)) label = short(label);
        if (!url) { plain(label); continue; }
        const a = el('a', null, label || url);
        a.href = url; if (!/^mailto:/i.test(url)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        into.append(a);
      } else {
        const b = el('strong'); inline(m[3], b); into.append(b);
      }
    }
    plain(text.slice(last));
  }
  const norm = t => unesc(t).toLowerCase().replace(/\([^)]*\)|[^a-zäöüß0-9]/g, '');
  function markdown(raw, title) {
    const box = el('div', 'md');
    let para = null, list = null, single = null;      // single: letzter einzeiliger Absatz samt Rohtext
    const flush = () => { para = null; list = null; };
    const heading = text => { const h = el('h3'); inline(text, h); box.append(h); single = null; };
    // "• a • b • c" in einer Zeile wird zu einzelnen Listenpunkten
    const lines = clean(raw).split('\n').flatMap(l => (l.match(/•/g) || []).length < 2 ? [l]
      : l.split('•').map((part, i) => i === 0 ? part.trim() : '• ' + part.trim()).filter(Boolean));
    for (const line of lines) {
      if (!line || /^[#*_\-=·•\s]+$/.test(line)) { para = null; continue; }   // Leerzeile trennt Absätze, aber keine Listen
      let m;
      if ((m = line.match(/^#{1,6}\s*(.+)$/))) {
        flush();
        const text = m[1].replace(/^[*_\s]+|[*_\s:]+$/g, '');
        if (!text || (title && norm(text) === norm(title))) continue;   // Überschrift, die nur den Stellentitel wiederholt
        heading(text);
      } else if ((m = line.match(/^\*{2,3}([^*:.!?]{2,60}):?\*{2,3}:?$/))) {
        flush();                                          // kurze, ganz fett gesetzte Zeile ohne Satzzeichen = Zwischenüberschrift
        heading(m[1].trim());
      } else if ((m = line.match(/^(?:[-•·▪◦–]|\*(?!\*))\s+(.+)$/))) {
        para = null;
        if (!list && single && box.lastChild === single.node && /^[^.!?;,]{2,60}:?$/.test(single.text)) {
          single.node.remove();                           // kurze Zeile direkt vor einer Liste = deren Überschrift
          heading(single.text.replace(/:$/, ''));
        }
        single = null;
        if (!list) { list = el('ul'); box.append(list); }
        const li = el('li'); inline(m[1], li); list.append(li);
      } else {
        list = null;
        if (!para) { para = el('p'); box.append(para); single = { node: para, text: line.replace(/\*{2,3}/g, '') }; }
        else { para.append(el('br')); single = null; }
        inline(line, para);
      }
    }
    return box;
  }
  // Für den Kartenauszug: reiner Text ohne Markdown-Zeichen
  function plainText(raw, title) {
    return clean(raw).split('\n').map(l => unesc(l.replace(/^#{1,6}\s*/, '').replace(/\[([^\]]+)\]\([^)\s]+\)/g, '$1').replace(/\*{2,3}/g, '').replace(/(?<![A-Za-zÄÖÜäöüß])\*|\*(?![A-Za-zÄÖÜäöüß])/g, '').replace(/^[-•·▪◦–]\s+/, '· ')).trim())
      .filter(l => l && !/^[#_\-=·•\s]+$/.test(l) && !(title && norm(l) === norm(title))).join('\n');
  }

  // Angaben der Schnittstelle in lesbare Kacheln übersetzen
  const WORKTIME = {
    arbeitszeitVollzeit: 'Vollzeit', arbeitszeitTeilzeitVormittag: 'Teilzeit vormittags', arbeitszeitTeilzeitNachmittag: 'Teilzeit nachmittags',
    arbeitszeitTeilzeitAbend: 'Teilzeit abends', arbeitszeitTeilzeitFlexibel: 'Teilzeit flexibel', arbeitszeitSchichtNachtWochenende: 'Schicht, Nacht, Wochenende',
    arbeitszeitHeimarbeitTelearbeit: 'Homeoffice', arbeitszeitMinijob: 'Minijob',
  };
  const HOMEOFFICE = { NACH_VEREINBARUNG: 'Nach Vereinbarung', VOLLSTAENDIG: 'Vollständig', TEILWEISE: 'Teilweise' };
  const FLAGS = { quereinstiegGeeignet: 'Quereinstieg möglich', istGeringfuegigeBeschaeftigung: 'Minijob', istArbeitnehmerUeberlassung: 'Zeitarbeit', istPrivateArbeitsvermittlung: 'Private Arbeitsvermittlung' };
  const human = v => { const t = String(v).replace(/_/g, ' ').toLowerCase(); return t.charAt(0).toUpperCase() + t.slice(1); };
  const empty = v => v == null || v === '' || /^KEINE_ANGABE/i.test(String(v));
  function factNodes(d) {
    const out = [];
    const tiles = el('div', 'tiles');
    const tile = (label, value) => { if (empty(value)) return; const t = el('div', 'tile'); t.append(el('span', null, label), el('strong', null, String(value))); tiles.append(t); };

    let vertrag = empty(d.vertragsdauer) ? '' : human(d.vertragsdauer);
    if (vertrag && Number(d.befristungInMonaten) > 0) vertrag += `, ${d.befristungInMonaten} Monate`;
    tile('Vertrag', vertrag);
    tile('Vergütung', empty(d.verguetungsangabe) ? (d.verguetung || d.gehalt || '') : human(d.verguetungsangabe));
    if (d.homeofficemoeglich === true) tile('Homeoffice', empty(d.homeofficetyp) ? 'Möglich' : (HOMEOFFICE[d.homeofficetyp] || human(d.homeofficetyp)));
    tile('Beruf', d.hauptberuf);
    const start = startText(d.eintrittszeitraum && d.eintrittszeitraum.von);
    tile('Start', start === 'ab sofort' ? 'Ab sofort' : start);
    tile('Online seit', fmtDate(d.datumErsteVeroeffentlichung));
    if (d.aenderungsdatum && fmtDate(d.aenderungsdatum) !== fmtDate(d.datumErsteVeroeffentlichung)) tile('Zuletzt geändert', fmtDate(d.aenderungsdatum));
    if (tiles.children.length) out.push(tiles);

    const times = Object.keys(d).filter(k => /^arbeitszeit/.test(k) && d[k] === true)
      .map(k => WORKTIME[k] || k.replace(/^arbeitszeit/, '').replace(/([a-z])([A-Z])/g, '$1 $2'));
    const flags = Object.keys(FLAGS).filter(k => d[k] === true).map(k => FLAGS[k]);
    const also = Object.keys(d).filter(k => /^alternativBeruf\d*$/.test(k) && typeof d[k] === 'string' && d[k]).map(k => d[k]);
    for (const [label, list, cls] of [['Arbeitszeit', times, 'tag on'], ['Merkmale', flags, 'tag on'], ['Auch passend für', also, 'tag']]) {
      if (!list.length) continue;
      const g = el('div', 'group');
      g.append(el('span', 'group-label', label));
      const row = el('div', 'chips');
      for (const t of list) row.append(el('span', cls, t));
      g.append(row);
      out.push(g);
    }
    return out;
  }

  function openDetails(job) {
    if (!job) return;
    const place = [job.plz, job.ort].filter(Boolean).join(' ');
    const sub = el('p', 'sub', [job.arbeitgeber, place, job.entfernung ? job.entfernung + ' km entfernt' : ''].filter(Boolean).join(' · '));
    const links = el('div', 'links');
    links.append(link('Zur Anzeige', 'https://www.arbeitsagentur.de/jobsuche/jobdetail/' + encodeURIComponent(job.refnr), true));
    if (job.externeUrl) links.append(link('Originalanzeige', job.externeUrl));
    const desc = el('div', 'md');
    desc.append(el('p', 'sub', 'Beschreibung wird geladen …'));
    const facts = el('div', 'facts');
    facts.hidden = true;
    const saved = store.liked[job.refnr];
    const hide = el('div', 'links');
    hide.hidden = true;
    const hideBy = (label, word) => {
      const b = button(label, () => {
        if (!profile.exclude.includes(word)) profile.exclude.push(word);
        const gone = deck.filter(j => !fits(j, profile));
        for (const j of gone) { store.seen[j.refnr] = 1; inDeck.delete(j.refnr); }
        deck = deck.filter(j => fits(j, profile));
        save(); closeSheet(); $('deck').dataset.key = ''; render();
        if (deck.length < 6) loadMore();
      });
      b.classList.add('quiet'); hide.append(b);
    };
    const canHide = !saved && view === 'deck' && job === deck[0];
    if (canHide && job.arbeitgeber) { hideBy('Arbeitgeber nicht mehr zeigen', job.arbeitgeber); hide.hidden = false; }
    openSheet(job.titel, sub, ...(saved ? [trackNodes(saved)] : []), facts, links, hide, desc);
    loadDetails(job.refnr).then(d => {
      const text = d.stellenangebotsBeschreibung || d.stellenbeschreibung;
      if (text) desc.replaceWith(markdown(text, job.titel));
      else desc.replaceChildren(el('p', 'sub', 'Für diese Stelle gibt es hier keinen Beschreibungstext. Öffne die Anzeige über den Knopf oben.'));
      facts.replaceChildren(...factNodes(d));
      const main = String(d.hauptberuf || job.beruf || '').replace(/\/in\b|\/-?frau\b/g, '').trim();
      if (main && canHide && !hasWord(job.titel, main)) { hideBy(`Beruf „${main}“ nicht mehr zeigen`, main); hide.hidden = false; }
      facts.hidden = !facts.children.length;
      const ext = d.externeURL || d.externeUrl;
      if (!job.externeUrl && /^https?:\/\//i.test(ext || '')) links.append(link(d.allianzpartnerName ? 'Original bei ' + d.allianzpartnerName : 'Originalanzeige', ext));
    }).catch(e => {
      const gone = e && (e.status === 404 || e.status === 410);
      if (gone && saved && !saved.gone) { saved.gone = true; saved.checked = Date.now(); save(); if (view === 'saved') renderSaved(); }
      desc.replaceChildren(el('p', 'sub', gone ? 'Diese Stelle ist bei der Arbeitsagentur nicht mehr online. Vermutlich ist sie besetzt oder zurückgezogen.'
        : 'Die Details konnten nicht geladen werden. Öffne die Anzeige über den Knopf oben.'));
    });
  }

    const when = el('div', 'two'); when.style.gridTemplateColumns = '1fr 1fr'; when.append(field('Befristung', befr), field('Veröffentlicht', seit));

    const ok = button('Stellen anzeigen', () => {}, true); ok.type = 'submit';
    const clear = button('Filter zurücksetzen', () => { azBoxes.forEach(c => { c.checked = false; }); befr.value = ''; seit.value = ''; hideBoxes.forEach(c => { c.checked = true; }); });

  // ---------- Sichern und übertragen: Merkliste, Stufen, Notizen und Berufe als Datei oder Code ----------
  const CODE_PREFIX = 'JOBSTAPEL1:';
  const str = (v, max) => String(v == null ? '' : v).slice(0, max);
  function cleanJob(j) {
    if (!j || !/^[\w.\-]{3,80}$/.test(String(j.refnr || ''))) return null;
    return {
      refnr: String(j.refnr), titel: str(j.titel, 300) || '(ohne Titel)', arbeitgeber: str(j.arbeitgeber, 200), plz: str(j.plz, 10), ort: str(j.ort, 100),
      entfernung: Number(j.entfernung) > 0 ? Math.round(Number(j.entfernung)) : 0,
      aktuelleVeroeffentlichungsdatum: str(j.aktuelleVeroeffentlichungsdatum, 30), eintrittsdatum: str(j.eintrittsdatum, 30),
      kundennummerHash: str(j.kundennummerHash, 200), externeUrl: /^https?:\/\//i.test(j.externeUrl || '') ? str(j.externeUrl, 600) : '',
      term: str(j.term, 80), profil: str(j.profil, 40), gemerkt: Number(j.gemerkt) || Date.now(),
      status: STATUS.some(x => x[0] === j.status) ? j.status : 'gemerkt', statusAt: Number(j.statusAt) || 0, note: str(j.note, 500),
      gone: !!j.gone, checked: Number(j.checked) || 0,
    };
  }
  function exportData() {
    return JSON.stringify({ app: 'jobstapel', version: 1, exportiert: new Date().toISOString(), liked: store.liked, seen: Object.keys(store.seen), profiles: PROFILES });
  }
  const toCode = json => CODE_PREFIX + btoa(unescape(encodeURIComponent(json)));
  function parseImport(text) {
    text = String(text || '').trim();
    if (text.startsWith(CODE_PREFIX)) text = decodeURIComponent(escape(atob(text.slice(CODE_PREFIX.length).replace(/\s+/g, ''))));
    const data = JSON.parse(text);
    if (!data || data.app !== 'jobstapel' || typeof data.liked !== 'object') throw new Error('kein Jobstapel-Export');
    return data;
  }
  // Zusammenführen: nichts Vorhandenes geht verloren; bei derselben Stelle gewinnt der jüngere Stand.
  function mergeImport(data) {
    let added = 0, updated = 0, jobs = 0;
    const stamp = j => Math.max(Number(j.statusAt) || 0, Number(j.gemerkt) || 0);
    for (const raw of Object.values(data.liked || {})) {
      const job = cleanJob(raw);
      if (!job) continue;
      const have = store.liked[job.refnr];
      if (!have) { store.liked[job.refnr] = job; added++; }
      else if (stamp(job) > stamp(have)) { store.liked[job.refnr] = job; updated++; }
      delete store.seen[job.refnr];
    }
    for (const r of Array.isArray(data.seen) ? data.seen.slice(0, 4000) : []) if (/^[\w.\-]{3,80}$/.test(r) && !store.liked[r]) store.seen[r] = 1;
    for (const raw of Array.isArray(data.profiles) ? data.profiles.slice(0, 40) : []) {
      if (!raw || !raw.id) continue;
      const next = cleanProfile(raw), have = PROFILES.find(x => x.id === next.id);
      if (have) Object.assign(have, next); else { PROFILES.push(next); jobs++; }
    }
    save();
    return { added, updated, jobs };
  }
  function openBackup() {
    const count = Object.keys(store.liked).length;
    const intro = el('p', 'small', `Sichert ${count === 1 ? '1 gemerkte Stelle' : count + ' gemerkte Stellen'} mit Stufen und Notizen sowie deine Berufe. Damit ziehst du auch vom Browser in die installierte App oder auf ein anderes Gerät um.`);
    const out = el('p', 'result'); out.setAttribute('role', 'status');
    const code = el('textarea', 'code'); code.id = 'backup-code'; code.rows = 4; code.placeholder = 'Code hier einfügen';
    const say = t => { out.textContent = t; };

    const saveFile = button('Als Datei speichern', () => {
      try {
        const a = el('a'); a.href = URL.createObjectURL(new Blob([exportData()], { type: 'application/json' }));
        a.download = `jobstapel-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        say('Datei wird gespeichert.');
      } catch (e) { say('Speichern als Datei geht hier nicht. Nimm stattdessen den Code.'); }
    }, true);
    const copy = button('Code kopieren', async () => {
      const text = toCode(exportData());
      try { await navigator.clipboard.writeText(text); say('Code kopiert. Füge ihn auf dem anderen Gerät unter „Sichern“ ein.'); }
      catch (e) { code.value = text; code.focus(); code.select(); say('Kopieren nicht möglich. Der Code steht unten im Feld, bitte von Hand kopieren.'); }
    });
    const exp = el('div', 'links'); exp.append(saveFile, copy);

    const run = text => {
      try {
        const r = mergeImport(parseImport(text));
        say(`Übernommen: ${r.added} neue Stellen, ${r.updated} aktualisiert${r.jobs ? `, ${r.jobs} neue Berufe` : ''}.`);
        code.value = '';
        renderChrome(); if (view === 'saved') { renderSaved(); checkSaved(); }
      } catch (e) { say('Das ist kein gültiger Jobstapel-Export. Nichts wurde geändert.'); }
    };
    const file = el('input', 'file'); file.type = 'file'; file.accept = 'application/json,.json'; file.id = 'backup-file';
    file.addEventListener('change', () => { const f = file.files && file.files[0]; if (!f) return; f.text().then(run).catch(() => say('Die Datei konnte nicht gelesen werden.')); file.value = ''; });
    const pickFile = el('label', 'btn', 'Datei auswählen'); pickFile.htmlFor = file.id; pickFile.style.cssText = 'flex-direction:row;letter-spacing:0;text-transform:none;font-size:.95rem;cursor:pointer';
    const paste = button('Code übernehmen', () => { if (code.value.trim()) run(code.value); else say('Füge zuerst den Code ins Feld ein.'); });
    const imp = el('div', 'links'); imp.append(pickFile, file, paste);
    const codeLabel = el('label', null, 'Code'); codeLabel.htmlFor = code.id; codeLabel.append(code);

    openSheet('Sichern und übertragen', intro, el('span', 'group-label', 'Sichern'), exp, out,
      el('span', 'group-label', 'Wiederherstellen oder übernehmen'), codeLabel, imp,
      el('p', 'small', 'Beim Übernehmen wird zusammengeführt: Vorhandenes bleibt, bei derselben Stelle gilt der jüngere Stand.'));
  }
