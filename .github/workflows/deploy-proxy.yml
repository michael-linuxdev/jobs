name: Worker-Proxy deployen

# Veroeffentlicht proxy/worker.js bei Cloudflare Workers.
# Braucht das Repo-Secret CLOUDFLARE_API_TOKEN. Das Konto ermittelt Wrangler aus dem Token.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/deploy-proxy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret pruefen
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret CLOUDFLARE_API_TOKEN fehlt, Deploy uebersprungen."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Worker deployen
        if: steps.check.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: proxy
          command: deploy
