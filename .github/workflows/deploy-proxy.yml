name: Deploy BA CORS proxy

# Deploys proxy/worker.js to Cloudflare Workers when CLOUDFLARE_API_TOKEN
# (+ optional CLOUDFLARE_ACCOUNT_ID) is set as a repo secret.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "proxy/**"
      - ".github/workflows/deploy-proxy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare token
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret — skip deploy. Add the secret to publish a permanent worker."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Worker
        if: steps.check.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: proxy
          command: deploy
